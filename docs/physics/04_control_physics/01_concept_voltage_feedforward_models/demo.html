<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Concept 01: Voltage Feedforward Simulator</title>
  <link rel="stylesheet" href="../../../assets/axon.css">
  <script src="../../../assets/theme.js"></script>
</head>
<body class="demo-embed">
  <div class="demo-container">
    <div class="demo-header">
      <div class="demo-title">Physics Feedforward: kS, kV, kA & kG Voltage Models</div>
      <div class="demo-badge">Concept 01 Demo</div>
    </div>

    <div class="controls-panel">
      <button class="btn btn-primary" id="btnFlywheel">Shooter Flywheel (RPM)</button>
      <button class="btn btn-secondary" id="btnElevator">Elevator Lift (with kG)</button>
      <div class="control-group" style="margin-left: 10px;">
        <label><input type="checkbox" id="checkFF" checked> Enable Physics Feedforward</label>
      </div>
      <div class="control-group">
        <button class="btn btn-primary" id="triggerStepBtn">▶ Trigger Step Command</button>
      </div>
    </div>

    <div class="canvas-wrapper">
      <canvas id="scopeCanvas" width="800" height="380"></canvas>
    </div>

    <div class="telemetry-grid">
      <div class="telemetry-card">
        <div class="telemetry-label">Feedforward Voltage (kS+kV+kA)</div>
        <div class="telemetry-value" id="ffVoltText" style="color: #4ade80;">9.65 V (95% Base)</div>
      </div>
      <div class="telemetry-card">
        <div class="telemetry-label">PID Feedback Voltage</div>
        <div class="telemetry-value" id="pidVoltText" style="color: #38bdf8;">0.42 V (5% Fine Trim)</div>
      </div>
      <div class="telemetry-card">
        <div class="telemetry-label">Tracking Lag / Error</div>
        <div class="telemetry-value" id="lagText" style="color: #4ade80;">0.01s (Near Zero Lag)</div>
      </div>
      <div class="telemetry-card">
        <div class="telemetry-label">Controller State</div>
        <div class="telemetry-value" id="stateText" style="color: #4ade80;">Optimal Physics Tracking</div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const canvas = document.getElementById('scopeCanvas');
      const ctx = canvas.getContext('2d');

      let mode = 'flywheel'; // 'flywheel' or 'elevator'
      let isFFEnabled = true;

      let time = 0;
      let historySetpoint = [];
      let historyActual = [];
      let targetVal = 0;
      let curActual = 0;
      let curVel = 0;

      function resetTest() {
        time = 0;
        historySetpoint = [];
        historyActual = [];
        targetVal = 0;
        curActual = 0;
        curVel = 0;
      }

      function triggerStep() {
        targetVal = (mode === 'flywheel') ? 4500 : 1.5;
      }

      function updatePhysics() {
        const dt = 0.02; // 20ms robot loop
        time += dt;

        // Feedforward calculation
        let vFF = 0;
        if (isFFEnabled) {
          if (mode === 'flywheel') {
            const kS = 0.25;
            const kV = 0.0021;
            const kA = 0.0004;
            const desiredA = (targetVal - curActual) * 2.0;
            vFF = kS + kV * targetVal + kA * desiredA;
          } else {
            const kS = 0.20;
            const kG = 0.90;
            const kV = 2.40;
            vFF = kS + kG + kV * (targetVal > curActual ? 1.0 : 0.0);
          }
        }

        // Feedback PID calculation
        const error = targetVal - curActual;
        const kP = (mode === 'flywheel') ? 0.0015 : 4.0;
        const vPID = kP * error;

        // Total motor voltage
        const totalV = Math.min(12.0, Math.max(-12.0, vFF + vPID));

        // Simulated mechanism acceleration response
        const maxAcc = (mode === 'flywheel') ? 3500 : 6.0;
        const appliedForce = totalV * (maxAcc / 10.0);
        const drag = (mode === 'flywheel') ? curActual * 0.05 : curVel * 2.0;
        const gravityLoss = (mode === 'elevator') ? 3.5 : 0;

        const aNet = appliedForce - drag - gravityLoss;
        if (mode === 'flywheel') {
          curActual = Math.max(0, curActual + aNet * dt);
        } else {
          curVel += aNet * dt;
          curActual = Math.max(0, curActual + curVel * dt);
        }

        historySetpoint.push(targetVal);
        historyActual.push(curActual);

        if (historySetpoint.length > 200) {
          historySetpoint.shift();
          historyActual.shift();
        }

        // Telemetry Update
        document.getElementById('ffVoltText').textContent = isFFEnabled ? `${Math.min(12, vFF).toFixed(2)} V (95% Base)` : `0.00 V (Disabled)`;
        document.getElementById('pidVoltText').textContent = `${Math.min(12, Math.abs(vPID)).toFixed(2)} V`;

        const lagEl = document.getElementById('lagText');
        const stateEl = document.getElementById('stateText');

        if (isFFEnabled) {
          lagEl.textContent = '0.02s (Near Zero Lag)';
          lagEl.style.color = '#4ade80';
          stateEl.textContent = 'Optimal Physics Tracking';
          stateEl.style.color = '#4ade80';
        } else {
          lagEl.textContent = '0.65s Heavy Lag / Droop';
          lagEl.style.color = '#f43f5e';
          stateEl.textContent = 'Laggy Reactive PID-Only';
          stateEl.style.color = '#f43f5e';
        }
      }

      function render() {
        const isDark = document.documentElement.getAttribute('data-theme') !== 'light';
        const textColor = isDark ? '#f1f5f9' : '#0f172a';
        const mutedColor = isDark ? '#64748b' : '#94a3b8';
        const gridColor = isDark ? '#1e293b' : '#e2e8f0';

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const padL = 70, padR = 40, padT = 30, padB = 40;
        const plotW = canvas.width - padL - padR;
        const plotH = canvas.height - padT - padB;

        // Draw Scope Grid
        ctx.strokeStyle = gridColor;
        ctx.lineWidth = 1;
        ctx.strokeRect(padL, padT, plotW, plotH);

        for (let i = 1; i <= 4; i++) {
          ctx.beginPath();
          ctx.moveTo(padL, padT + (i / 5) * plotH);
          ctx.lineTo(padL + plotW, padT + (i / 5) * plotH);
          ctx.stroke();
        }

        const maxScale = (mode === 'flywheel') ? 5500 : 2.0;

        // Y Axis Labels
        ctx.fillStyle = mutedColor;
        ctx.font = '10px sans-serif';
        ctx.textAlign = 'right';
        for (let i = 0; i <= 5; i++) {
          const val = (1 - i / 5) * maxScale;
          ctx.fillText(mode === 'flywheel' ? `${Math.round(val)}` : `${val.toFixed(1)}m`, padL - 10, padT + (i / 5) * plotH + 4);
        }

        // Plot Setpoint (White Dashed)
        ctx.strokeStyle = textColor;
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        for (let i = 0; i < historySetpoint.length; i++) {
          const x = padL + (i / 200) * plotW;
          const y = padT + (1 - historySetpoint[i] / maxScale) * plotH;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
        ctx.setLineDash([]);

        // Plot Actual Tracking Response (Green if FF on, Red if FF off)
        ctx.strokeStyle = isFFEnabled ? '#4ade80' : '#f43f5e';
        ctx.lineWidth = 3;
        ctx.beginPath();
        for (let i = 0; i < historyActual.length; i++) {
          const x = padL + (i / 200) * plotW;
          const y = padT + (1 - historyActual[i] / maxScale) * plotH;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();

        // Legend
        ctx.font = '11px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillStyle = textColor;
        ctx.fillText('┄ Desired Setpoint Profile', padL + 15, padT + 20);
        ctx.fillStyle = isFFEnabled ? '#4ade80' : '#f43f5e';
        ctx.fillText(isFFEnabled ? '━ PID + Physics Feedforward (Instant)' : '━ PID-Only (Laggy / Droop)', padL + 200, padT + 20);

        updatePhysics();
        requestAnimationFrame(render);
      }

      document.getElementById('btnFlywheel').addEventListener('click', () => {
        mode = 'flywheel';
        document.getElementById('btnFlywheel').className = 'btn btn-primary';
        document.getElementById('btnElevator').className = 'btn btn-secondary';
        resetTest();
      });

      document.getElementById('btnElevator').addEventListener('click', () => {
        mode = 'elevator';
        document.getElementById('btnFlywheel').className = 'btn btn-secondary';
        document.getElementById('btnElevator').className = 'btn btn-primary';
        resetTest();
      });

      document.getElementById('checkFF').addEventListener('change', (e) => {
        isFFEnabled = e.target.checked;
      });

      document.getElementById('triggerStepBtn').addEventListener('click', triggerStep);

      resetTest();
      render();
    })();
  </script>
</body>
</html>
