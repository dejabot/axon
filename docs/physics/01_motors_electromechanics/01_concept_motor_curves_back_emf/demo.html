<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Concept 01: DC Motor Dynamometer Curves</title>
  <link rel="stylesheet" href="../../../assets/axon.css">
  <script src="../../../assets/theme.js"></script>
</head>
<body class="demo-embed">
  <div class="demo-container">
    <div class="demo-header">
      <div class="demo-title">Brushless DC Motor Dynamometer & Electromechanics</div>
      <div class="demo-badge">Concept 01 Demo</div>
    </div>

    <div class="controls-panel">
      <button class="btn btn-primary" id="btnKraken">Kraken X60</button>
      <button class="btn btn-secondary" id="btnFalcon">Falcon 500</button>
      <button class="btn btn-secondary" id="btnNEO">NEO 1.1</button>
      <div class="control-group" style="margin-left: 10px;">
        <label>Voltage: <span id="voltDisplay" class="value-display">12.0 V</span></label>
        <input type="range" id="voltSlider" min="1.0" max="12.0" step="0.5" value="12.0">
      </div>
      <div class="control-group">
        <label>Operating Speed: <span id="rpmDisplay" class="value-display">3000 RPM</span></label>
        <input type="range" id="rpmSlider" min="0" max="6000" step="50" value="3000">
      </div>
    </div>

    <div class="canvas-wrapper">
      <canvas id="dynoCanvas" width="800" height="380"></canvas>
    </div>

    <div class="telemetry-grid">
      <div class="telemetry-card">
        <div class="telemetry-label">Output Torque</div>
        <div class="telemetry-value" id="torqueText" style="color: #f43f5e;">3.55 Nm</div>
      </div>
      <div class="telemetry-card">
        <div class="telemetry-label">Current Draw</div>
        <div class="telemetry-value" id="currentText" style="color: #38bdf8;">183.0 A</div>
      </div>
      <div class="telemetry-card">
        <div class="telemetry-label">Mechanical Output Power</div>
        <div class="telemetry-value" id="powerText" style="color: #4ade80;">1,114 W (Peak)</div>
      </div>
      <div class="telemetry-card">
        <div class="telemetry-label">Electrical Efficiency</div>
        <div class="telemetry-value" id="effText" style="color: #fbbf24;">50.7%</div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const canvas = document.getElementById('dynoCanvas');
      const ctx = canvas.getContext('2d');

      const motors = {
        kraken: { name: "Kraken X60", stallTorque: 7.09, freeRpm: 6000, stallCurrent: 366, freeCurrent: 2.0 },
        falcon: { name: "Falcon 500", stallTorque: 4.69, freeRpm: 6380, stallCurrent: 257, freeCurrent: 1.5 },
        neo:    { name: "NEO 1.1",    stallTorque: 3.75, freeRpm: 5676, stallCurrent: 166, freeCurrent: 1.8 }
      };

      let activeMotor = motors.kraken;

      function render() {
        const isDark = document.documentElement.getAttribute('data-theme') !== 'light';
        const textColor = isDark ? '#f1f5f9' : '#0f172a';
        const mutedColor = isDark ? '#64748b' : '#94a3b8';
        const gridColor = isDark ? '#1e293b' : '#e2e8f0';

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const vApplied = parseFloat(document.getElementById('voltSlider').value);
        const vRatio = vApplied / 12.0;
        const freeRpmScaled = activeMotor.freeRpm * vRatio;
        const stallTorqueScaled = activeMotor.stallTorque * vRatio;
        const stallCurrentScaled = activeMotor.stallCurrent * vRatio;

        const maxRpmSlider = Math.round(activeMotor.freeRpm);
        document.getElementById('rpmSlider').max = maxRpmSlider;

        let curRpm = Math.min(parseFloat(document.getElementById('rpmSlider').value), freeRpmScaled);

        document.getElementById('voltDisplay').textContent = `${vApplied.toFixed(1)} V`;
        document.getElementById('rpmDisplay').textContent = `${Math.round(curRpm)} RPM`;

        // Layout
        const padL = 70, padR = 60, padT = 30, padB = 50;
        const plotW = canvas.width - padL - padR;
        const plotH = canvas.height - padT - padB;

        // Draw Axes & Grid
        ctx.strokeStyle = gridColor;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(padL, padT);
        ctx.lineTo(padL, padT + plotH);
        ctx.lineTo(padL + plotW, padT + plotH);
        ctx.stroke();

        // X Axis labels
        ctx.fillStyle = mutedColor;
        ctx.font = '11px sans-serif';
        ctx.textAlign = 'center';
        for (let r = 0; r <= 7000; r += 1000) {
          const x = padL + (r / 7000) * plotW;
          if (x <= padL + plotW) {
            ctx.fillText(`${r}`, x, padT + plotH + 18);
          }
        }
        ctx.fillText('Motor Speed (RPM)', padL + plotW / 2, padT + plotH + 36);

        // Max Power Scaling
        const maxPower = (activeMotor.stallTorque * 12.0 * (activeMotor.freeRpm * 2 * Math.PI / 60)) / 4;

        // Plot 1: Torque Curve (Red Line)
        ctx.strokeStyle = '#f43f5e';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(padL, padT + (1 - stallTorqueScaled / 8.0) * plotH);
        const freeX = padL + (freeRpmScaled / 7000) * plotW;
        ctx.lineTo(freeX, padT + plotH);
        ctx.stroke();

        // Plot 2: Mechanical Power Curve (Green Parabola)
        ctx.strokeStyle = '#4ade80';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        for (let r = 0; r <= freeRpmScaled; r += 50) {
          const t = stallTorqueScaled * (1 - r / freeRpmScaled);
          const omega = r * (2 * Math.PI / 60);
          const p = t * omega;
          const px = padL + (r / 7000) * plotW;
          const py = padT + (1 - p / (maxPower * 1.15)) * plotH;
          if (r === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.stroke();

        // Plot 3: Current Draw (Cyan Line)
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(padL, padT + (1 - stallCurrentScaled / 400.0) * plotH);
        ctx.lineTo(freeX, padT + (1 - activeMotor.freeCurrent / 400.0) * plotH);
        ctx.stroke();
        ctx.setLineDash([]);

        // Operating Point Indicator Line
        const curX = padL + (curRpm / 7000) * plotW;
        ctx.strokeStyle = '#fbbf24';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(curX, padT);
        ctx.lineTo(curX, padT + plotH);
        ctx.stroke();

        // Calculate Operating Point Values
        const curTorque = Math.max(0, stallTorqueScaled * (1 - (freeRpmScaled > 0 ? curRpm / freeRpmScaled : 1)));
        const curCurrent = activeMotor.freeCurrent + (stallCurrentScaled - activeMotor.freeCurrent) * (freeRpmScaled > 0 ? (1 - curRpm / freeRpmScaled) : 1);
        const curOmega = curRpm * (2 * Math.PI / 60);
        const curMechPower = curTorque * curOmega;
        const curElecPower = Math.max(1, vApplied * curCurrent);
        const curEff = Math.min(100, Math.max(0, (curMechPower / curElecPower) * 100));

        // Legend Top Right
        ctx.textAlign = 'left';
        ctx.font = '11px sans-serif';
        ctx.fillStyle = '#f43f5e'; ctx.fillText('━ Torque (Nm)', padL + 15, padT + 20);
        ctx.fillStyle = '#4ade80'; ctx.fillText('━ Mechanical Power (W)', padL + 130, padT + 20);
        ctx.fillStyle = '#38bdf8'; ctx.fillText('┄ Current (A)', padL + 300, padT + 20);

        // Telemetry Update
        document.getElementById('torqueText').textContent = `${curTorque.toFixed(2)} Nm`;
        document.getElementById('currentText').textContent = `${curCurrent.toFixed(1)} A`;
        document.getElementById('powerText').textContent = `${Math.round(curMechPower)} W`;
        document.getElementById('effText').textContent = `${curEff.toFixed(1)}%`;
      }

      document.getElementById('btnKraken').addEventListener('click', () => {
        activeMotor = motors.kraken;
        document.getElementById('btnKraken').className = 'btn btn-primary';
        document.getElementById('btnFalcon').className = 'btn btn-secondary';
        document.getElementById('btnNEO').className = 'btn btn-secondary';
        render();
      });

      document.getElementById('btnFalcon').addEventListener('click', () => {
        activeMotor = motors.falcon;
        document.getElementById('btnKraken').className = 'btn btn-secondary';
        document.getElementById('btnFalcon').className = 'btn btn-primary';
        document.getElementById('btnNEO').className = 'btn btn-secondary';
        render();
      });

      document.getElementById('btnNEO').addEventListener('click', () => {
        activeMotor = motors.neo;
        document.getElementById('btnKraken').className = 'btn btn-secondary';
        document.getElementById('btnFalcon').className = 'btn btn-secondary';
        document.getElementById('btnNEO').className = 'btn btn-primary';
        render();
      });

      document.getElementById('voltSlider').addEventListener('input', render);
      document.getElementById('rpmSlider').addEventListener('input', render);

      render();
    })();
  </script>
</body>
</html>
