<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Concept 01: Friction Circle & Traction Limit Sandbox</title>
  <link rel="stylesheet" href="../../../assets/axon.css">
  <script src="../../../assets/theme.js"></script>
</head>
<body class="demo-embed">
  <div class="demo-container">
    <div class="demo-header">
      <div class="demo-title">2D Friction Circle, Static Grip & Wheel Slip Limits</div>
      <div class="demo-badge">Concept 01 Demo</div>
    </div>

    <div class="controls-panel">
      <div class="control-group">
        <label>Forward Force: <span id="fxDisplay" class="value-display">550 N</span></label>
        <input type="range" id="fxSlider" min="0" max="1100" step="25" value="550">
      </div>
      <div class="control-group">
        <label>Lateral/Turn Force: <span id="fyDisplay" class="value-display">300 N</span></label>
        <input type="range" id="fySlider" min="0" max="800" step="25" value="300">
      </div>
      <div class="control-group">
        <label>Tread Friction (μ): <span id="muDisplay" class="value-display">1.35</span></label>
        <input type="range" id="muSlider" min="0.80" max="1.80" step="0.05" value="1.35">
      </div>
      <div class="control-group">
        <label>Robot Mass: <span id="massDisplay" class="value-display">55 kg</span></label>
        <input type="range" id="massSlider" min="35" max="65" step="1" value="55">
      </div>
    </div>

    <div class="canvas-wrapper">
      <canvas id="frictionCanvas" width="800" height="380"></canvas>
    </div>

    <div class="telemetry-grid">
      <div class="telemetry-card">
        <div class="telemetry-label">Total Force Demand ||F||</div>
        <div class="telemetry-value" id="demandText" style="color: #38bdf8;">626 N</div>
      </div>
      <div class="telemetry-card">
        <div class="telemetry-label">Max Static Friction Limit</div>
        <div class="telemetry-value" id="limitText" style="color: #4ade80;">728 N (1.35G Max)</div>
      </div>
      <div class="telemetry-card">
        <div class="telemetry-label">Net Acceleration</div>
        <div class="telemetry-value" id="accelText" style="color: #fbbf24;">11.39 m/s² (1.16 G)</div>
      </div>
      <div class="telemetry-card">
        <div class="telemetry-label">Traction State</div>
        <div class="telemetry-value" id="statusText" style="color: #4ade80;">SOLID STATIC GRIP</div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const canvas = document.getElementById('frictionCanvas');
      const ctx = canvas.getContext('2d');

      const g = 9.81;

      function render() {
        const isDark = document.documentElement.getAttribute('data-theme') !== 'light';
        const textColor = isDark ? '#f1f5f9' : '#0f172a';
        const mutedColor = isDark ? '#64748b' : '#94a3b8';
        const gridColor = isDark ? '#1e293b' : '#e2e8f0';

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const fx = parseFloat(document.getElementById('fxSlider').value);
        const fy = parseFloat(document.getElementById('fySlider').value);
        const mu = parseFloat(document.getElementById('muSlider').value);
        const mass = parseFloat(document.getElementById('massSlider').value);

        document.getElementById('fxDisplay').textContent = `${Math.round(fx)} N`;
        document.getElementById('fyDisplay').textContent = `${Math.round(fy)} N`;
        document.getElementById('muDisplay').textContent = mu.toFixed(2);
        document.getElementById('massDisplay').textContent = `${Math.round(mass)} kg`;

        const normalForce = mass * g;
        const maxStaticFriction = mu * normalForce;
        const totalDemand = Math.hypot(fx, fy);
        const isSlipping = totalDemand > maxStaticFriction;

        // Visual Friction Circle Layout
        const centerX = 260;
        const centerY = 190;
        const maxVisualR = 150;
        const scale = maxVisualR / 950; // pixels per Newton

        const frictionRadius = maxStaticFriction * scale;

        // Draw Coordinate Axes
        ctx.strokeStyle = gridColor;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(centerX - maxVisualR - 30, centerY);
        ctx.lineTo(centerX + maxVisualR + 30, centerY);
        ctx.moveTo(centerX, centerY - maxVisualR - 30);
        ctx.lineTo(centerX, centerY + maxVisualR + 30);
        ctx.stroke();

        // Draw Friction Circle
        ctx.fillStyle = isSlipping ? 'rgba(244, 63, 94, 0.12)' : 'rgba(74, 222, 128, 0.12)';
        ctx.beginPath();
        ctx.arc(centerX, centerY, frictionRadius, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = isSlipping ? '#f43f5e' : '#4ade80';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        // Draw Force Demand Vector
        const vx = fx * scale;
        const vy = fy * scale;
        const vecEndX = centerX + vy; // Lateral on X axis
        const vecEndY = centerY - vx; // Forward on Y axis

        ctx.strokeStyle = isSlipping ? '#f43f5e' : '#38bdf8';
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(vecEndX, vecEndY);
        ctx.stroke();

        ctx.fillStyle = isSlipping ? '#f43f5e' : '#38bdf8';
        ctx.beginPath();
        ctx.arc(vecEndX, vecEndY, 6, 0, Math.PI * 2);
        ctx.fill();

        // Labels on Left Circle
        ctx.font = 'bold 11px sans-serif';
        ctx.fillStyle = isSlipping ? '#f43f5e' : '#4ade80';
        ctx.fillText(`Friction Limit (${Math.round(maxStaticFriction)} N)`, centerX + frictionRadius * 0.7, centerY - frictionRadius * 0.7);

        // Right Section: Robot Chassis Diagram
        const botX = 580;
        const botY = 190;
        const botSize = 100;

        ctx.fillStyle = isDark ? '#141923' : '#f8fafc';
        ctx.fillRect(botX - botSize / 2, botY - botSize / 2, botSize, botSize);
        ctx.strokeStyle = isSlipping ? '#f43f5e' : '#38bdf8';
        ctx.lineWidth = 2;
        ctx.strokeRect(botX - botSize / 2, botY - botSize / 2, botSize, botSize);

        // 4 Swerve Wheels
        const wheelOffsets = [
          { x: -botSize/2, y: -botSize/2 },
          { x: botSize/2, y: -botSize/2 },
          { x: -botSize/2, y: botSize/2 },
          { x: botSize/2, y: botSize/2 }
        ];

        wheelOffsets.forEach(w => {
          ctx.fillStyle = isSlipping ? '#f43f5e' : '#fbbf24';
          ctx.fillRect(botX + w.x - 6, botY + w.y - 12, 12, 24);
        });

        ctx.fillStyle = textColor;
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Swerve Drivetrain', botX, botY + botSize / 2 + 28);

        if (isSlipping) {
          ctx.fillStyle = '#f43f5e';
          ctx.fillText('⚠ TIRES BURNING & SLIPPING!', botX, botY - botSize / 2 - 16);
        } else {
          ctx.fillStyle = '#4ade80';
          ctx.fillText('✔ 100% Pure Static Grip', botX, botY - botSize / 2 - 16);
        }

        // Telemetry Update
        const effectiveForce = isSlipping ? maxStaticFriction * 0.65 : totalDemand; // 35% kinetic drop
        const netAccel = effectiveForce / mass;

        document.getElementById('demandText').textContent = `${Math.round(totalDemand)} N`;
        document.getElementById('limitText').textContent = `${Math.round(maxStaticFriction)} N (${(mu).toFixed(2)}G Max)`;
        document.getElementById('accelText').textContent = `${netAccel.toFixed(2)} m/s² (${(netAccel / g).toFixed(2)} G)`;

        const statusEl = document.getElementById('statusText');
        if (isSlipping) {
          statusEl.textContent = 'WHEEL SLIP & TRACTION LOSS (-35% Force)';
          statusEl.style.color = '#f43f5e';
        } else {
          statusEl.textContent = 'SOLID STATIC GRIP';
          statusEl.style.color = '#4ade80';
        }
      }

      document.getElementById('fxSlider').addEventListener('input', render);
      document.getElementById('fySlider').addEventListener('input', render);
      document.getElementById('muSlider').addEventListener('input', render);
      document.getElementById('massSlider').addEventListener('input', render);

      render();
    })();
  </script>
</body>
</html>
