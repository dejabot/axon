# GitHub Pages (classic "deploy from a branch") builds this docs/ folder with Jekyll.
# We provide our own dark-first layout + stylesheet instead of the default Primer theme,
# so the prose pages and the interactive HTML demos share one look.

title: Axon Curriculum
description: A first-principles curriculum for applied math, physical dynamics, control theory, machine learning, and robotics.
# Served from the custom domain in docs/CNAME, which puts the site at the root.
# baseurl must therefore be empty: with baseurl "/axon" every relative_url in the
# layout renders as /axon/... and 404s, taking the stylesheet down with it.
url: "https://axons.dejabotz.com"
baseurl: ""

# Apply our layout to every page. GitHub Pages' jekyll-optional-front-matter turns the
# front-matter-less Markdown files into pages, and this default gives them our chrome —
# so none of the lesson files need front matter added.
defaults:
  - scope:
      path: ""
    values:
      layout: default

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

exclude:
  - "*.DS_Store"
