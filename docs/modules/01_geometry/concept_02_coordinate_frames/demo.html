<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Concept 02: Coordinate Frames Visualizer</title>
  <script src="../../../assets/theme.js"></script>
  <link rel="stylesheet" href="../../../assets/axon.css">
  <style>
    .demo-wrap {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 12px;
    }
    .canvas-container {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      position: relative;
      overflow: hidden;
      min-height: 340px;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }
    .stats-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 12px 16px;
      border-radius: 10px;
      font-family: ui-monospace, "SF Mono", monospace;
      font-size: 0.85rem;
    }
    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .stat-label {
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
    }
    .stat-val {
      font-weight: 700;
      color: var(--ink);
    }
  </style>
</head>
<body>
  <div class="demo-wrap">
    <div class="canvas-container">
      <canvas id="frameCanvas"></canvas>
    </div>
    
    <div class="stats-row">
      <div class="stat-item">
        <span class="stat-label">Robot Frame Origin (Field X, Y)</span>
        <span class="stat-val" id="robotPosText" style="color: var(--accent);">[4.0, 2.0] m</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Local Offset (Robot X, Y)</span>
        <span class="stat-val" id="localOffText" style="color: var(--accent-green);">[+1.5, +0.5] m</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Target on Field (Global X, Y)</span>
        <span class="stat-val" id="globalPosText" style="color: var(--accent-amber); font-size: 1.05rem;">[5.5, 2.5] m</span>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('frameCanvas');
    const ctx = canvas.getContext('2d');

    const fieldX = 10.0;
    const fieldY = 6.0;

    let robot = { x: 3.5, y: 2.5 };
    let piece = { x: 5.5, y: 3.5 };
    let dragging = null;

    function resize() {
      const rect = canvas.parentElement.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      draw();
    }
    window.addEventListener('resize', resize);
    window.addEventListener('axon-theme-changed', draw);

    function toScreen(mx, my) {
      const pad = 35;
      const w = (canvas.width / (window.devicePixelRatio || 1)) - pad * 2;
      const h = (canvas.height / (window.devicePixelRatio || 1)) - pad * 2;
      return {
        x: pad + (mx / fieldX) * w,
        y: pad + h - (my / fieldY) * h
      };
    }

    function toMeters(sx, sy) {
      const pad = 35;
      const w = (canvas.width / (window.devicePixelRatio || 1)) - pad * 2;
      const h = (canvas.height / (window.devicePixelRatio || 1)) - pad * 2;
      return {
        x: Math.max(0, Math.min(fieldX, ((sx - pad) / w) * fieldX)),
        y: Math.max(0, Math.min(fieldY, (1.0 - (sy - pad) / h) * fieldY))
      };
    }

    function draw() {
      const isLight = document.documentElement.getAttribute('data-theme') === 'light';
      const width = canvas.width / (window.devicePixelRatio || 1);
      const height = canvas.height / (window.devicePixelRatio || 1);

      ctx.clearRect(0, 0, width, height);

      // Global Field Axes
      const originScr = toScreen(0, 0);
      const maxXScr = toScreen(fieldX, 0);
      const maxYScr = toScreen(0, fieldY);

      ctx.strokeStyle = isLight ? '#94a3b8' : '#334155';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(originScr.x, originScr.y); ctx.lineTo(maxXScr.x, maxXScr.y);
      ctx.moveTo(originScr.x, originScr.y); ctx.lineTo(maxYScr.x, maxYScr.y);
      ctx.stroke();

      ctx.font = '11px sans-serif';
      ctx.fillStyle = isLight ? '#64748b' : '#94a3b8';
      ctx.fillText('Field X (East)', maxXScr.x - 70, maxXScr.y + 16);
      ctx.fillText('Field Y (North)', maxYScr.x - 20, maxYScr.y - 8);

      const rScr = toScreen(robot.x, robot.y);
      const pScr = toScreen(piece.x, piece.y);

      // Local Robot Axes
      const rAxisLen = 45;
      ctx.strokeStyle = isLight ? '#0284c7' : '#38bdf8';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(rScr.x, rScr.y); ctx.lineTo(rScr.x + rAxisLen, rScr.y);
      ctx.moveTo(rScr.x, rScr.y); ctx.lineTo(rScr.x, rScr.y - rAxisLen);
      ctx.stroke();

      ctx.fillStyle = isLight ? '#0284c7' : '#38bdf8';
      ctx.fillText('+X_robot (Forward)', rScr.x + rAxisLen + 4, rScr.y + 4);
      ctx.fillText('+Y_robot (Left)', rScr.x - 15, rScr.y - rAxisLen - 6);

      // Dashed local offset line
      ctx.setLineDash([3, 3]);
      ctx.strokeStyle = isLight ? '#16a34a' : '#4ade80';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(rScr.x, rScr.y);
      ctx.lineTo(pScr.x, rScr.y);
      ctx.lineTo(pScr.x, pScr.y);
      ctx.stroke();
      ctx.setLineDash([]);

      // Robot Box
      ctx.fillStyle = isLight ? '#0284c7' : '#38bdf8';
      ctx.fillRect(rScr.x - 14, rScr.y - 14, 28, 28);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.strokeRect(rScr.x - 14, rScr.y - 14, 28, 28);

      // Piece Circle
      ctx.fillStyle = isLight ? '#d97706' : '#fbbf24';
      ctx.beginPath(); ctx.arc(pScr.x, pScr.y, 8, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.stroke();

      // Telemetry
      const localX = piece.x - robot.x;
      const localY = piece.y - robot.y;

      document.getElementById('robotPosText').textContent = `[${robot.x.toFixed(1)}, ${robot.y.toFixed(1)}] m`;
      document.getElementById('localOffText').textContent = `[${localX >= 0 ? '+' : ''}${localX.toFixed(1)}, ${localY >= 0 ? '+' : ''}${localY.toFixed(1)}] m`;
      document.getElementById('globalPosText').textContent = `[${piece.x.toFixed(1)}, ${piece.y.toFixed(1)}] m`;
    }

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: cx - rect.left, y: cy - rect.top };
    }

    canvas.addEventListener('mousedown', (e) => {
      const p = getPos(e);
      const rScr = toScreen(robot.x, robot.y);
      const pScr = toScreen(piece.x, piece.y);
      if (Math.hypot(p.x - rScr.x, p.y - rScr.y) < 25) dragging = 'robot';
      else if (Math.hypot(p.x - pScr.x, p.y - pScr.y) < 25) dragging = 'piece';
    });

    window.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      const p = getPos(e);
      const m = toMeters(p.x, p.y);
      if (dragging === 'robot') { robot.x = m.x; robot.y = m.y; }
      if (dragging === 'piece') { piece.x = m.x; piece.y = m.y; }
      draw();
    });

    window.addEventListener('mouseup', () => dragging = null);

    canvas.addEventListener('touchstart', (e) => {
      const p = getPos(e);
      const rScr = toScreen(robot.x, robot.y);
      const pScr = toScreen(piece.x, piece.y);
      if (Math.hypot(p.x - rScr.x, p.y - rScr.y) < 30) dragging = 'robot';
      else if (Math.hypot(p.x - pScr.x, p.y - pScr.y) < 30) dragging = 'piece';
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (!dragging) return;
      e.preventDefault();
      const p = getPos(e);
      const m = toMeters(p.x, p.y);
      if (dragging === 'robot') { robot.x = m.x; robot.y = m.y; }
      if (dragging === 'piece') { piece.x = m.x; piece.y = m.y; }
      draw();
    }, { passive: false });

    window.addEventListener('touchend', () => dragging = null);

    resize();
  </script>
</body>
</html>
