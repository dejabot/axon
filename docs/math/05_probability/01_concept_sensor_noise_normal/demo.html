<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Concept 01: Sensor Noise & Bell Curve Visualizer</title>
  <script src="../../../assets/theme.js"></script>
  <link rel="stylesheet" href="../../../assets/axon.css">
  <style>
    .demo-wrap {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 12px;
    }
    .canvas-container {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      position: relative;
      overflow: hidden;
      min-height: 340px;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .sliders-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 0.85rem;
    }
    .slider-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }
    .stats-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 12px 16px;
      border-radius: 10px;
      font-family: ui-monospace, "SF Mono", monospace;
      font-size: 0.85rem;
    }
    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .stat-label {
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
    }
    .stat-val {
      font-weight: 700;
      color: var(--ink);
    }
  </style>
</head>
<body>
  <div class="demo-wrap">
    <div class="canvas-container">
      <canvas id="noiseCanvas"></canvas>
    </div>

    <div class="sliders-row">
      <div class="slider-item">
        <label>True Distance Mean (μ): <b id="muLabel" style="color: var(--accent);">4.00 m</b></label>
        <input type="range" id="muSlider" min="2.0" max="6.0" step="0.1" value="4.0">
      </div>
      <div class="slider-item">
        <label>Sensor Noise Std Dev (σ): <b id="sigmaLabel" style="color: var(--accent-amber);">0.30 m</b></label>
        <input type="range" id="sigmaSlider" min="0.10" max="0.80" step="0.05" value="0.30">
      </div>
    </div>
    
    <div class="stats-row">
      <div class="stat-item">
        <span class="stat-label">Center Mean (μ)</span>
        <span class="stat-val" id="muText" style="color: var(--accent);">4.00 m</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Spread (σ)</span>
        <span class="stat-val" id="sigmaText" style="color: var(--accent-amber);">±0.30 m</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">68% Interval (±1σ)</span>
        <span class="stat-val" id="int68Text" style="color: var(--accent-green);">[3.70, 4.30] m</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">95% Interval (±2σ)</span>
        <span class="stat-val" id="int95Text" style="color: var(--muted);">[3.40, 4.60] m</span>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('noiseCanvas');
    const ctx = canvas.getContext('2d');

    let mu = 4.0;
    let sigma = 0.30;
    let samples = [];

    function generateSamples() {
      samples = [];
      for (let i = 0; i < 600; i++) {
        // Box-Muller transform for normal distribution
        const u1 = Math.random();
        const u2 = Math.random();
        const z = Math.sqrt(-2.0 * Math.log(u1)) * Math.cos(2.0 * Math.PI * u2);
        samples.push(mu + z * sigma);
      }
    }
    generateSamples();

    function resize() {
      const rect = canvas.parentElement.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      draw();
    }
    window.addEventListener('resize', resize);
    window.addEventListener('axon-theme-changed', draw);

    function gaussianPDF(x, m, s) {
      return (1.0 / (s * Math.sqrt(2 * Math.PI))) * Math.exp(-0.5 * ((x - m) / s) ** 2);
    }

    function toScreen(x, y) {
      const pad = 40;
      const w = (canvas.width / (window.devicePixelRatio || 1)) - pad * 2;
      const h = (canvas.height / (window.devicePixelRatio || 1)) - pad * 2;
      return {
        x: pad + ((x - 1.0) / 6.0) * w,
        y: pad + h - (y / 2.2) * h
      };
    }

    function draw() {
      const isLight = document.documentElement.getAttribute('data-theme') === 'light';
      const width = canvas.width / (window.devicePixelRatio || 1);
      const height = canvas.height / (window.devicePixelRatio || 1);

      ctx.clearRect(0, 0, width, height);

      const o = toScreen(1.0, 0);

      // Axes
      ctx.strokeStyle = isLight ? '#cbd5e1' : '#232b3b';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(toScreen(1.0, 0).x, toScreen(1.0, 0).y);
      ctx.lineTo(toScreen(7.0, 0).x, toScreen(7.0, 0).y);
      ctx.stroke();

      // Histogram of random samples
      const numBins = 30;
      const binWidth = 6.0 / numBins;
      const counts = new Array(numBins).fill(0);
      for (const s of samples) {
        const bin = Math.floor((s - 1.0) / binWidth);
        if (bin >= 0 && bin < numBins) counts[bin]++;
      }

      ctx.fillStyle = isLight ? 'rgba(2, 132, 199, 0.2)' : 'rgba(56, 189, 248, 0.15)';
      ctx.strokeStyle = isLight ? 'rgba(2, 132, 199, 0.5)' : 'rgba(56, 189, 248, 0.35)';
      ctx.lineWidth = 1;
      for (let i = 0; i < numBins; i++) {
        const xStart = 1.0 + i * binWidth;
        const count = counts[i];
        const density = count / (samples.length * binWidth);
        const p1 = toScreen(xStart, 0);
        const p2 = toScreen(xStart + binWidth, density);
        ctx.fillRect(p1.x, p2.y, p2.x - p1.x, p1.y - p2.y);
        ctx.strokeRect(p1.x, p2.y, p2.x - p1.x, p1.y - p2.y);
      }

      // Theoretical Gaussian Bell Curve
      ctx.strokeStyle = isLight ? '#d97706' : '#fbbf24';
      ctx.lineWidth = 3;
      ctx.beginPath();
      const steps = 100;
      for (let i = 0; i <= steps; i++) {
        const x = 1.0 + (i / steps) * 6.0;
        const y = gaussianPDF(x, mu, sigma);
        const pt = toScreen(x, y);
        if (i === 0) ctx.moveTo(pt.x, pt.y);
        else ctx.lineTo(pt.x, pt.y);
      }
      ctx.stroke();

      // Center Line (Mean μ)
      const peakY = gaussianPDF(mu, mu, sigma);
      const topPt = toScreen(mu, peakY);
      const botPt = toScreen(mu, 0);
      ctx.setLineDash([3, 3]);
      ctx.strokeStyle = isLight ? '#0284c7' : '#38bdf8';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(topPt.x, topPt.y); ctx.lineTo(botPt.x, botPt.y); ctx.stroke();
      ctx.setLineDash([]);

      // Telemetry
      document.getElementById('muText').textContent = `${mu.toFixed(2)} m`;
      document.getElementById('sigmaText').textContent = `±${sigma.toFixed(2)} m`;
      document.getElementById('int68Text').textContent = `[${(mu - sigma).toFixed(2)}, ${(mu + sigma).toFixed(2)}] m`;
      document.getElementById('int95Text').textContent = `[${(mu - 2*sigma).toFixed(2)}, ${(mu + 2*sigma).toFixed(2)}] m`;
    }

    document.getElementById('muSlider').addEventListener('input', (e) => {
      mu = parseFloat(e.target.value);
      document.getElementById('muLabel').textContent = `${mu.toFixed(2)} m`;
      generateSamples();
      draw();
    });

    document.getElementById('sigmaSlider').addEventListener('input', (e) => {
      sigma = parseFloat(e.target.value);
      document.getElementById('sigmaLabel').textContent = `${sigma.toFixed(2)} m`;
      generateSamples();
      draw();
    });

    resize();
  </script>
</body>
</html>
