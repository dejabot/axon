<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Concept 18: Softmax & Temperature Visualizer</title>
  <script src="../../../assets/theme.js"></script>
  <link rel="stylesheet" href="../../../assets/axon.css">
  <style>
    .demo-wrap {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 12px;
    }
    .canvas-container {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      position: relative;
      overflow: hidden;
      min-height: 340px;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .sliders-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 0.8rem;
    }
    .slider-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }
    .stats-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 12px 16px;
      border-radius: 10px;
      font-family: ui-monospace, "SF Mono", monospace;
      font-size: 0.85rem;
    }
    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .stat-label {
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
    }
    .stat-val {
      font-weight: 700;
      color: var(--ink);
    }
  </style>
</head>
<body>
  <div class="demo-wrap">
    <div class="canvas-container">
      <canvas id="softmaxCanvas"></canvas>
    </div>

    <div class="sliders-row">
      <div class="slider-item">
        <label>Note Logit: <b id="l1Label">+3.2</b></label>
        <input type="range" id="l1Slider" min="-3.0" max="5.0" step="0.2" value="3.2">
      </div>
      <div class="slider-item">
        <label>Reef Logit: <b id="l2Label">+1.1</b></label>
        <input type="range" id="l2Slider" min="-3.0" max="5.0" step="0.2" value="1.1">
      </div>
      <div class="slider-item">
        <label>Robot Logit: <b id="l3Label">-0.8</b></label>
        <input type="range" id="l3Slider" min="-3.0" max="5.0" step="0.2" value="-0.8">
      </div>
      <div class="slider-item">
        <label>Temperature (T): <b id="tLabel" style="color: var(--accent-amber);">1.0</b></label>
        <input type="range" id="tSlider" min="0.2" max="3.0" step="0.1" value="1.0">
      </div>
    </div>
    
    <div class="stats-row">
      <div class="stat-item">
        <span class="stat-label">P(Note / Piece)</span>
        <span class="stat-val" id="p1Text" style="color: var(--accent-green);">88.0%</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">P(Reef / Field)</span>
        <span class="stat-val" id="p2Text" style="color: var(--accent);">10.7%</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">P(Robot / Defense)</span>
        <span class="stat-val" id="p3Text" style="color: var(--accent-red);">1.3%</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Sum Total Check</span>
        <span class="stat-val" id="sumText" style="color: var(--muted);">100.0%</span>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('softmaxCanvas');
    const ctx = canvas.getContext('2d');

    let z1 = 3.2, z2 = 1.1, z3 = -0.8;
    let temp = 1.0;

    function resize() {
      const rect = canvas.parentElement.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      draw();
    }
    window.addEventListener('resize', resize);
    window.addEventListener('axon-theme-changed', draw);

    function calcSoftmax() {
      const e1 = Math.exp(z1 / temp);
      const e2 = Math.exp(z2 / temp);
      const e3 = Math.exp(z3 / temp);
      const sum = e1 + e2 + e3;
      return [e1 / sum, e2 / sum, e3 / sum];
    }

    function draw() {
      const isLight = document.documentElement.getAttribute('data-theme') === 'light';
      const width = canvas.width / (window.devicePixelRatio || 1);
      const height = canvas.height / (window.devicePixelRatio || 1);

      ctx.clearRect(0, 0, width, height);

      const probs = calcSoftmax();
      const labels = ['Game Piece (Note)', 'Field Reef Element', 'Opponent Robot'];
      const colors = ['#4ade80', '#38bdf8', '#f43f5e'];

      const barW = Math.min(100, (width - 120) / 3);
      const startX = (width - (barW * 3 + 40 * 2)) / 2;
      const maxH = height - 100;
      const baseGround = height - 45;

      // Ground Line
      ctx.strokeStyle = isLight ? '#cbd5e1' : '#232b3b';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(20, baseGround); ctx.lineTo(width - 20, baseGround);
      ctx.stroke();

      for (let i = 0; i < 3; i++) {
        const bx = startX + i * (barW + 40);
        const bh = probs[i] * maxH;
        const by = baseGround - bh;

        // Bar Fill
        ctx.fillStyle = colors[i];
        ctx.fillRect(bx, by, barW, bh);

        // Percentage Text above bar
        ctx.font = 'bold 13px ui-monospace, "SF Mono", monospace';
        ctx.fillStyle = isLight ? '#0f172a' : '#f8fafc';
        ctx.textAlign = 'center';
        ctx.fillText(`${(probs[i] * 100).toFixed(1)}%`, bx + barW / 2, by - 8);

        // Label below bar
        ctx.font = '11px sans-serif';
        ctx.fillStyle = isLight ? '#64748b' : '#94a3b8';
        ctx.fillText(labels[i], bx + barW / 2, baseGround + 20);
      }
      ctx.textAlign = 'start';

      // Telemetry
      document.getElementById('p1Text').textContent = `${(probs[0] * 100).toFixed(1)}%`;
      document.getElementById('p2Text').textContent = `${(probs[1] * 100).toFixed(1)}%`;
      document.getElementById('p3Text').textContent = `${(probs[2] * 100).toFixed(1)}%`;
      document.getElementById('sumText').textContent = `${((probs[0] + probs[1] + probs[2]) * 100).toFixed(1)}%`;
    }

    document.getElementById('l1Slider').addEventListener('input', (e) => {
      z1 = parseFloat(e.target.value);
      document.getElementById('l1Label').textContent = `${z1 >= 0 ? '+' : ''}${z1.toFixed(1)}`;
      draw();
    });
    document.getElementById('l2Slider').addEventListener('input', (e) => {
      z2 = parseFloat(e.target.value);
      document.getElementById('l2Label').textContent = `${z2 >= 0 ? '+' : ''}${z2.toFixed(1)}`;
      draw();
    });
    document.getElementById('l3Slider').addEventListener('input', (e) => {
      z3 = parseFloat(e.target.value);
      document.getElementById('l3Label').textContent = `${z3 >= 0 ? '+' : ''}${z3.toFixed(1)}`;
      draw();
    });
    document.getElementById('tSlider').addEventListener('input', (e) => {
      temp = parseFloat(e.target.value);
      document.getElementById('tLabel').textContent = temp.toFixed(1);
      draw();
    });

    resize();
  </script>
</body>
</html>
