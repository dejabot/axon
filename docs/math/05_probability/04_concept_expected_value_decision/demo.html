<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Concept 04: Endgame Monte Carlo Visualizer</title>
  <script src="../../../assets/theme.js"></script>
  <link rel="stylesheet" href="../../../assets/axon.css">
  <style>
    .demo-wrap {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 12px;
    }
    .canvas-container {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      position: relative;
      overflow: hidden;
      min-height: 340px;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .controls-row {
      display: flex;
      gap: 12px;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 0.85rem;
    }
    input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
    }
    button.action-btn {
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .stats-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 12px 16px;
      border-radius: 10px;
      font-family: ui-monospace, "SF Mono", monospace;
      font-size: 0.85rem;
    }
    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .stat-label {
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
    }
    .stat-val {
      font-weight: 700;
      color: var(--ink);
    }
  </style>
</head>
<body>
  <div class="demo-wrap">
    <div class="canvas-container">
      <canvas id="mcCanvas"></canvas>
    </div>

    <div class="controls-row">
      <label>Strategy B Win Rate: <b id="probLabel" style="color: var(--accent-green);">65%</b></label>
      <input type="range" id="probSlider" min="10" max="95" step="5" value="65">
      <button class="action-btn" onclick="runSim()">Simulate 1,000 Matches</button>
    </div>
    
    <div class="stats-row">
      <div class="stat-item">
        <span class="stat-label">Strategy A Expected (Safe)</span>
        <span class="stat-val" id="evAText" style="color: var(--accent);">2.00 pts</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Strategy B Expected (Theoretical)</span>
        <span class="stat-val" id="evBText" style="color: var(--accent-green);">3.25 pts</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Strategy B Simulated Mean</span>
        <span class="stat-val" id="simBText" style="color: var(--accent-amber); font-size: 1.05rem;">3.24 pts</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Total Simulated Matches</span>
        <span class="stat-val" id="trialsText" style="color: var(--muted);">1,000</span>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('mcCanvas');
    const ctx = canvas.getContext('2d');

    let winRate = 0.65;
    let histA = [0, 0, 1000, 0, 0, 0]; // 100% at 2 pts
    let histB = [350, 0, 0, 0, 0, 650]; // 35% 0 pts, 65% 5 pts
    let totalTrials = 1000;
    let simMeanB = 3.25;

    function runSim() {
      histB = [0, 0, 0, 0, 0, 0];
      let sum = 0;
      for (let i = 0; i < totalTrials; i++) {
        const isWin = Math.random() < winRate;
        const score = isWin ? 5 : 0;
        histB[score]++;
        sum += score;
      }
      simMeanB = sum / totalTrials;
      draw();
    }

    function resize() {
      const rect = canvas.parentElement.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      draw();
    }
    window.addEventListener('resize', resize);
    window.addEventListener('axon-theme-changed', draw);

    function draw() {
      const isLight = document.documentElement.getAttribute('data-theme') === 'light';
      const width = canvas.width / (window.devicePixelRatio || 1);
      const height = canvas.height / (window.devicePixelRatio || 1);

      ctx.clearRect(0, 0, width, height);

      const baseGround = height - 40;
      const maxH = height - 90;

      // Axes
      ctx.strokeStyle = isLight ? '#cbd5e1' : '#232b3b';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(30, baseGround); ctx.lineTo(width - 30, baseGround);
      ctx.stroke();

      const numScores = 6; // 0 to 5 pts
      const slotW = (width - 80) / numScores;

      for (let s = 0; s < numScores; s++) {
        const slotX = 40 + s * slotW;
        const barW = (slotW - 16) / 2;

        // Strategy A Bar (Blue)
        const countA = histA[s];
        const hA = (countA / totalTrials) * maxH;
        if (hA > 0) {
          ctx.fillStyle = isLight ? 'rgba(2, 132, 199, 0.7)' : 'rgba(56, 189, 248, 0.7)';
          ctx.fillRect(slotX, baseGround - hA, barW, hA);
          ctx.font = 'bold 11px sans-serif';
          ctx.fillStyle = isLight ? '#0284c7' : '#38bdf8';
          ctx.textAlign = 'center';
          ctx.fillText(`${((countA / totalTrials) * 100).toFixed(0)}%`, slotX + barW / 2, baseGround - hA - 6);
        }

        // Strategy B Bar (Green)
        const countB = histB[s];
        const hB = (countB / totalTrials) * maxH;
        if (hB > 0) {
          ctx.fillStyle = isLight ? 'rgba(22, 163, 74, 0.7)' : 'rgba(74, 222, 128, 0.7)';
          ctx.fillRect(slotX + barW + 4, baseGround - hB, barW, hB);
          ctx.font = 'bold 11px sans-serif';
          ctx.fillStyle = isLight ? '#16a34a' : '#4ade80';
          ctx.textAlign = 'center';
          ctx.fillText(`${((countB / totalTrials) * 100).toFixed(0)}%`, slotX + barW + 4 + barW / 2, baseGround - hB - 6);
        }

        // Score tick label
        ctx.font = '11px sans-serif';
        ctx.fillStyle = isLight ? '#64748b' : '#94a3b8';
        ctx.textAlign = 'center';
        ctx.fillText(`${s} pts`, slotX + slotW / 2 - 8, baseGround + 20);
      }
      ctx.textAlign = 'start';

      // Telemetry
      const theoB = 5 * winRate;
      document.getElementById('evAText').textContent = '2.00 pts';
      document.getElementById('evBText').textContent = `${theoB.toFixed(2)} pts`;
      document.getElementById('simBText').textContent = `${simMeanB.toFixed(2)} pts`;
    }

    document.getElementById('probSlider').addEventListener('input', (e) => {
      winRate = parseInt(e.target.value) / 100;
      document.getElementById('probLabel').textContent = `${(winRate * 100).toFixed(0)}%`;
      runSim();
    });

    runSim();
    resize();
  </script>
</body>
</html>
