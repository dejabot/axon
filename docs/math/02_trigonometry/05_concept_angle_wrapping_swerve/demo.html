<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Concept 03: Swerve Angle Wrapping Visualizer</title>
  <script src="../../../assets/theme.js"></script>
  <link rel="stylesheet" href="../../../assets/axon.css">
  <style>
    .demo-wrap {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 12px;
    }
    .canvas-container {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      position: relative;
      overflow: hidden;
      min-height: 340px;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }
    .stats-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 12px 16px;
      border-radius: 10px;
      font-family: ui-monospace, "SF Mono", monospace;
      font-size: 0.85rem;
    }
    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .stat-label {
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
    }
    .stat-val {
      font-weight: 700;
      color: var(--ink);
    }
  </style>
</head>
<body>
  <div class="demo-wrap">
    <div class="canvas-container">
      <canvas id="wrapCanvas"></canvas>
    </div>
    
    <div class="stats-row">
      <div class="stat-item">
        <span class="stat-label">Current Heading (Cyan)</span>
        <span class="stat-val" id="currText" style="color: var(--accent);">+170.0°</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Target Heading (Amber)</span>
        <span class="stat-val" id="targetText" style="color: var(--accent-amber);">-170.0°</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Naive Error</span>
        <span class="stat-val" id="naiveText" style="color: var(--accent-red);">-340.0° (Spin!)</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Shortest Turn</span>
        <span class="stat-val" id="smartText" style="color: var(--accent-green); font-size: 1.05rem;">+20.0°</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Swerve Speed Flip</span>
        <span class="stat-val" id="swerveText" style="color: var(--accent-amber);">+1.0×</span>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('wrapCanvas');
    const ctx = canvas.getContext('2d');

    let currDeg = 170.0;
    let targetDeg = -170.0;
    let dragging = null;

    function resize() {
      const rect = canvas.parentElement.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      draw();
    }
    window.addEventListener('resize', resize);
    window.addEventListener('axon-theme-changed', draw);

    function wrap180(d) {
      return (d + 180.0) % 360.0 - 180.0;
    }

    function draw() {
      const isLight = document.documentElement.getAttribute('data-theme') === 'light';
      const width = canvas.width / (window.devicePixelRatio || 1);
      const height = canvas.height / (window.devicePixelRatio || 1);

      ctx.clearRect(0, 0, width, height);

      const cx = width / 2;
      const cy = height / 2;
      const r = Math.min(width, height) * 0.38;

      // Outer Circle
      ctx.strokeStyle = isLight ? '#cbd5e1' : '#232b3b';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.stroke();

      const cRad = currDeg * Math.PI / 180;
      const tRad = targetDeg * Math.PI / 180;
      const rawError = targetDeg - currDeg;
      const wrappedError = wrap180(rawError);

      // Shortest arc (green)
      ctx.strokeStyle = isLight ? '#16a34a' : '#4ade80';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(cx, cy, r * 0.8, -cRad, -(cRad + wrappedError * Math.PI / 180), wrappedError < 0);
      ctx.stroke();

      // Current pointer (cyan)
      const cx_pt = cx + r * Math.cos(-cRad);
      const cy_pt = cy + r * Math.sin(-cRad);
      ctx.strokeStyle = isLight ? '#0284c7' : '#38bdf8';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx_pt, cy_pt); ctx.stroke();
      ctx.fillStyle = isLight ? '#0284c7' : '#38bdf8';
      ctx.beginPath(); ctx.arc(cx_pt, cy_pt, 8, 0, Math.PI * 2); ctx.fill();

      // Target pointer (amber)
      const tx_pt = cx + r * Math.cos(-tRad);
      const ty_pt = cy + r * Math.sin(-tRad);
      ctx.strokeStyle = isLight ? '#d97706' : '#fbbf24';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(tx_pt, ty_pt); ctx.stroke();
      ctx.fillStyle = isLight ? '#d97706' : '#fbbf24';
      ctx.beginPath(); ctx.arc(tx_pt, ty_pt, 8, 0, Math.PI * 2); ctx.fill();

      // Telemetry
      let speedFlip = 1.0;
      if (Math.abs(wrappedError) > 90.0) speedFlip = -1.0;

      document.getElementById('currText').textContent = `${currDeg >= 0 ? '+' : ''}${currDeg.toFixed(1)}°`;
      document.getElementById('targetText').textContent = `${targetDeg >= 0 ? '+' : ''}${targetDeg.toFixed(1)}°`;
      document.getElementById('naiveText').textContent = `${rawError >= 0 ? '+' : ''}${rawError.toFixed(1)}° ${Math.abs(rawError - wrappedError) > 10 ? '(Spin!)' : ''}`;
      document.getElementById('smartText').textContent = `${wrappedError >= 0 ? '+' : ''}${wrappedError.toFixed(1)}°`;
      document.getElementById('swerveText').textContent = `${speedFlip >= 0 ? '+1.0×' : '-1.0× (Inverted)'}`;
    }

    function getAngle(e) {
      const rect = canvas.getBoundingClientRect();
      const sx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
      const sy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
      const cx = (canvas.width / (window.devicePixelRatio || 1)) / 2;
      const cy = (canvas.height / (window.devicePixelRatio || 1)) / 2;
      return -Math.atan2(sy - cy, sx - cx) * 180 / Math.PI;
    }

    canvas.addEventListener('mousedown', (e) => {
      const a = getAngle(e);
      if (Math.abs(wrap180(a - currDeg)) < 25) dragging = 'curr';
      else dragging = 'target';
    });

    window.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      const a = getAngle(e);
      if (dragging === 'curr') currDeg = a;
      if (dragging === 'target') targetDeg = a;
      draw();
    });

    window.addEventListener('mouseup', () => dragging = null);

    canvas.addEventListener('touchstart', (e) => {
      const a = getAngle(e);
      if (Math.abs(wrap180(a - currDeg)) < 30) dragging = 'curr';
      else dragging = 'target';
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (!dragging) return;
      e.preventDefault();
      const a = getAngle(e);
      if (dragging === 'curr') currDeg = a;
      if (dragging === 'target') targetDeg = a;
      draw();
    }, { passive: false });

    window.addEventListener('touchend', () => dragging = null);

    resize();
  </script>
</body>
</html>
