<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Concept 04: Potential Field & Gradient Visualizer</title>
  <script src="../../../assets/theme.js"></script>
  <link rel="stylesheet" href="../../../assets/axon.css">
  <style>
    .demo-wrap {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 12px;
    }
    .canvas-container {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      position: relative;
      overflow: hidden;
      min-height: 340px;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }
    .stats-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 12px 16px;
      border-radius: 10px;
      font-family: ui-monospace, "SF Mono", monospace;
      font-size: 0.85rem;
    }
    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .stat-label {
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
    }
    .stat-val {
      font-weight: 700;
      color: var(--ink);
    }
  </style>
</head>
<body>
  <div class="demo-wrap">
    <div class="canvas-container">
      <canvas id="gradCanvas"></canvas>
    </div>
    
    <div class="stats-row">
      <div class="stat-item">
        <span class="stat-label">Robot Position (x, y)</span>
        <span class="stat-val" id="posText" style="color: var(--accent);">[1.5, 0.2]</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Uphill Gradient ∇U</span>
        <span class="stat-val" id="gradText" style="color: var(--accent-amber);">[-2.1, +0.4]</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Downhill Force -∇U</span>
        <span class="stat-val" id="forceText" style="color: var(--accent-green); font-size: 1.05rem;">[+2.1, -0.4] N</span>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gradCanvas');
    const ctx = canvas.getContext('2d');

    let robot = { x: 1.5, y: 0.3 };
    const goal = { x: 3.5, y: 0.0 };
    const obs = { x: 2.0, y: 0.0 };
    let dragging = false;

    function resize() {
      const rect = canvas.parentElement.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      draw();
    }
    window.addEventListener('resize', resize);
    window.addEventListener('axon-theme-changed', draw);

    function toScreen(x, y) {
      const cx = (canvas.width / (window.devicePixelRatio || 1)) / 2;
      const cy = (canvas.height / (window.devicePixelRatio || 1)) / 2;
      const scale = 50;
      return { x: cx + (x - 2.0) * scale, y: cy - y * scale };
    }

    function toMath(sx, sy) {
      const cx = (canvas.width / (window.devicePixelRatio || 1)) / 2;
      const cy = (canvas.height / (window.devicePixelRatio || 1)) / 2;
      const scale = 50;
      return { x: (sx - cx) / scale + 2.0, y: -(sy - cy) / scale };
    }

    function drawArrow(from, to, color, width = 3) {
      ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = width;
      ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(to.x, to.y); ctx.stroke();
      const angle = Math.atan2(to.y - from.y, to.x - from.x);
      const head = 8;
      ctx.beginPath();
      ctx.moveTo(to.x, to.y);
      ctx.lineTo(to.x - head * Math.cos(angle - Math.PI / 6), to.y - head * Math.sin(angle - Math.PI / 6));
      ctx.lineTo(to.x - head * Math.cos(angle + Math.PI / 6), to.y - head * Math.sin(angle + Math.PI / 6));
      ctx.closePath(); ctx.fill();
    }

    function draw() {
      const isLight = document.documentElement.getAttribute('data-theme') === 'light';
      const width = canvas.width / (window.devicePixelRatio || 1);
      const height = canvas.height / (window.devicePixelRatio || 1);

      ctx.clearRect(0, 0, width, height);

      const gScr = toScreen(goal.x, goal.y);
      const oScr = toScreen(obs.x, obs.y);
      const rScr = toScreen(robot.x, robot.y);

      // Goal target (Green bowl)
      ctx.strokeStyle = isLight ? '#16a34a' : '#4ade80';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(gScr.x, gScr.y, 16, 0, Math.PI*2); ctx.stroke();
      ctx.fillStyle = isLight ? '#16a34a' : '#4ade80';
      ctx.beginPath(); ctx.arc(gScr.x, gScr.y, 6, 0, Math.PI*2); ctx.fill();

      // Obstacle mountain (Red barrier)
      ctx.fillStyle = 'rgba(244, 63, 94, 0.25)';
      ctx.beginPath(); ctx.arc(oScr.x, oScr.y, 28, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = isLight ? '#e11d48' : '#f43f5e';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = isLight ? '#e11d48' : '#f43f5e';
      ctx.beginPath(); ctx.arc(oScr.x, oScr.y, 6, 0, Math.PI*2); ctx.fill();

      // Labels
      ctx.font = '11px sans-serif';
      ctx.fillStyle = isLight ? '#16a34a' : '#4ade80'; ctx.fillText('Goal (Attract)', gScr.x - 30, gScr.y - 22);
      ctx.fillStyle = isLight ? '#e11d48' : '#f43f5e'; ctx.fillText('Obstacle (Repel)', oScr.x - 35, oScr.y - 32);

      // Calculate Gradient & Force
      const pullX = -(robot.x - goal.x);
      const pullY = -(robot.y - goal.y);
      const dxO = robot.x - obs.x;
      const dyO = robot.y - obs.y;
      const distSq = Math.max(0.15, dxO*dxO + dyO*dyO);
      const pushX = (dxO / (distSq**1.5)) * 1.5;
      const pushY = (dyO / (distSq**1.5)) * 1.5;

      const fx = pullX + pushX;
      const fy = pullY + pushY;
      const gx = -fx;
      const gy = -fy;

      // Downhill Force Arrow (Green)
      const forceTip = { x: rScr.x + fx * 30, y: rScr.y - fy * 30 };
      drawArrow(rScr, forceTip, isLight ? '#16a34a' : '#4ade80', 3.5);

      // Uphill Gradient Arrow (Amber)
      const gradTip = { x: rScr.x + gx * 30, y: rScr.y - gy * 30 };
      drawArrow(rScr, gradTip, isLight ? '#d97706' : '#fbbf24', 2.5);

      // Robot Dot
      ctx.fillStyle = isLight ? '#0284c7' : '#38bdf8';
      ctx.beginPath(); ctx.arc(rScr.x, rScr.y, 8, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();

      // Telemetry
      document.getElementById('posText').textContent = `[${robot.x.toFixed(2)}, ${robot.y.toFixed(2)}]`;
      document.getElementById('gradText').textContent = `[${gx >= 0 ? '+' : ''}${gx.toFixed(2)}, ${gy >= 0 ? '+' : ''}${gy.toFixed(2)}]`;
      document.getElementById('forceText').textContent = `[${fx >= 0 ? '+' : ''}${fx.toFixed(2)}, ${fy >= 0 ? '+' : ''}${fy.toFixed(2)}] N`;
    }

    function updateFromPointer(e) {
      const rect = canvas.getBoundingClientRect();
      const sx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
      const sy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
      robot = toMath(sx, sy);
      draw();
    }

    canvas.addEventListener('mousedown', (e) => { dragging = true; updateFromPointer(e); });
    window.addEventListener('mousemove', (e) => { if (dragging) updateFromPointer(e); });
    window.addEventListener('mouseup', () => dragging = false);

    canvas.addEventListener('touchstart', (e) => { dragging = true; updateFromPointer(e); }, { passive: false });
    window.addEventListener('touchmove', (e) => { if (dragging) { e.preventDefault(); updateFromPointer(e); } }, { passive: false });
    window.addEventListener('touchend', () => dragging = false);

    resize();
  </script>
</body>
</html>
