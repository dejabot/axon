<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Concept 01: Rate of Change Visualizer</title>
  <script src="../../../assets/theme.js"></script>
  <link rel="stylesheet" href="../../../assets/axon.css">
  <style>
    .demo-wrap {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 12px;
    }
    .canvas-container {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      position: relative;
      overflow: hidden;
      min-height: 340px;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .controls-row {
      display: flex;
      gap: 16px;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 0.85rem;
    }
    input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
    }
    .stats-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 12px 16px;
      border-radius: 10px;
      font-family: ui-monospace, "SF Mono", monospace;
      font-size: 0.85rem;
    }
    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .stat-label {
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
    }
    .stat-val {
      font-weight: 700;
      color: var(--ink);
    }
  </style>
</head>
<body>
  <div class="demo-wrap">
    <div class="canvas-container">
      <canvas id="calcCanvas"></canvas>
    </div>

    <div class="controls-row">
      <label>Time Window (Δt): <b id="dtLabel" style="color: var(--accent-amber);">0.50 s</b></label>
      <input type="range" id="dtSlider" min="0.05" max="1.0" step="0.05" value="0.50">
    </div>
    
    <div class="stats-row">
      <div class="stat-item">
        <span class="stat-label">Position at t₁</span>
        <span class="stat-val" id="x1Text" style="color: var(--accent);">1.00 m</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Position at t₁ + Δt</span>
        <span class="stat-val" id="x2Text" style="color: var(--accent-green);">2.25 m</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Average Slope (Δx / Δt)</span>
        <span class="stat-val" id="avgSlopeText" style="color: var(--accent-amber);">2.50 m/s</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Exact Tangent Slope (dx/dt)</span>
        <span class="stat-val" id="trueSlopeText" style="color: var(--accent); font-size: 1.05rem;">2.00 m/s</span>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('calcCanvas');
    const ctx = canvas.getContext('2d');

    let t1 = 1.0;
    let dt = 0.50;

    // x(t) = t^2 (accelerating robot curve)
    function xOfT(t) { return t * t; }
    function vOfT(t) { return 2 * t; }

    function resize() {
      const rect = canvas.parentElement.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      draw();
    }
    window.addEventListener('resize', resize);
    window.addEventListener('axon-theme-changed', draw);

    function toScreen(t, x) {
      const pad = 40;
      const w = (canvas.width / (window.devicePixelRatio || 1)) - pad * 2;
      const h = (canvas.height / (window.devicePixelRatio || 1)) - pad * 2;
      return {
        x: pad + (t / 3.0) * w,
        y: pad + h - (x / 9.0) * h
      };
    }

    function draw() {
      const isLight = document.documentElement.getAttribute('data-theme') === 'light';
      const width = canvas.width / (window.devicePixelRatio || 1);
      const height = canvas.height / (window.devicePixelRatio || 1);

      ctx.clearRect(0, 0, width, height);

      const o = toScreen(0, 0);

      // Axes
      ctx.strokeStyle = isLight ? '#cbd5e1' : '#232b3b';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(toScreen(0,0).x, toScreen(0,0).y); ctx.lineTo(toScreen(3.0,0).x, toScreen(3.0,0).y);
      ctx.moveTo(toScreen(0,0).x, toScreen(0,0).y); ctx.lineTo(toScreen(0,9.0).x, toScreen(0,9.0).y);
      ctx.stroke();

      // Position curve x(t) = t^2
      ctx.strokeStyle = isLight ? '#0284c7' : '#38bdf8';
      ctx.lineWidth = 3;
      ctx.beginPath();
      const steps = 60;
      for (let i = 0; i <= steps; i++) {
        const t = (i / steps) * 3.0;
        const pt = toScreen(t, xOfT(t));
        if (i === 0) ctx.moveTo(pt.x, pt.y);
        else ctx.lineTo(pt.x, pt.y);
      }
      ctx.stroke();

      // Points P1 and P2
      const t2 = t1 + dt;
      const p1 = toScreen(t1, xOfT(t1));
      const p2 = toScreen(t2, xOfT(t2));

      // Secant slope line (Amber)
      ctx.strokeStyle = isLight ? '#d97706' : '#fbbf24';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y);
      ctx.stroke();

      // Exact Tangent line at P1 (Green dashed)
      const trueV = vOfT(t1);
      const tanStart = toScreen(t1 - 0.5, xOfT(t1) - trueV * 0.5);
      const tanEnd = toScreen(t1 + 0.5, xOfT(t1) + trueV * 0.5);
      ctx.setLineDash([3, 3]);
      ctx.strokeStyle = isLight ? '#16a34a' : '#4ade80';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(tanStart.x, tanStart.y); ctx.lineTo(tanEnd.x, tanEnd.y);
      ctx.stroke();
      ctx.setLineDash([]);

      // Dots
      ctx.fillStyle = isLight ? '#0284c7' : '#38bdf8';
      ctx.beginPath(); ctx.arc(p1.x, p1.y, 6, 0, Math.PI*2); ctx.fill();

      ctx.fillStyle = isLight ? '#d97706' : '#fbbf24';
      ctx.beginPath(); ctx.arc(p2.x, p2.y, 6, 0, Math.PI*2); ctx.fill();

      // Telemetry
      const x1 = xOfT(t1);
      const x2 = xOfT(t2);
      const avgSlope = (x2 - x1) / dt;

      document.getElementById('x1Text').textContent = `${x1.toFixed(2)} m`;
      document.getElementById('x2Text').textContent = `${x2.toFixed(2)} m`;
      document.getElementById('avgSlopeText').textContent = `${avgSlope.toFixed(2)} m/s`;
      document.getElementById('trueSlopeText').textContent = `${trueV.toFixed(2)} m/s`;
    }

    document.getElementById('dtSlider').addEventListener('input', (e) => {
      dt = parseFloat(e.target.value);
      document.getElementById('dtLabel').textContent = `${dt.toFixed(2)} s`;
      draw();
    });

    resize();
  </script>
</body>
</html>
