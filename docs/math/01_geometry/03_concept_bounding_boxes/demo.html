<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Concept 03: Collision & IoU Sandbox</title>
  <script src="../../../assets/theme.js"></script>
  <link rel="stylesheet" href="../../../assets/axon.css">
  <style>
    .demo-wrap { display: flex; flex-direction: column; gap: 12px; padding: 12px; }
    /* Container owns its height; the canvas is absolutely positioned so its size
       can never feed back into the container's and grow without bound. */
    .canvas-container {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 10px; position: relative; overflow: hidden; height: 370px;
    }
    canvas {
      position: absolute; inset: 0; width: 100%; height: 100%;
      display: block; cursor: grab; touch-action: none;
    }
    .hint {
      position: absolute; left: 10px; top: 8px; font-size: 0.7rem;
      color: var(--muted); pointer-events: none; font-family: system-ui, sans-serif;
    }
    .controls {
      display: flex; flex-wrap: wrap; gap: 16px; align-items: center;
      background: var(--panel); border: 1px solid var(--line);
      padding: 10px 16px; border-radius: 10px;
      font-size: 0.8rem; font-family: system-ui, sans-serif;
    }
    .controls label { display: flex; align-items: center; gap: 7px; color: var(--muted); }
    .controls input[type=checkbox] { accent-color: var(--accent); }
    .controls input[type=range] { accent-color: var(--accent); width: 110px; }
    .stats-row {
      display: flex; flex-wrap: wrap; gap: 10px 18px;
      background: var(--panel); border: 1px solid var(--line);
      padding: 12px 16px; border-radius: 10px;
      font-family: ui-monospace, "SF Mono", monospace; font-size: 0.82rem;
    }
    .stat-item { display: flex; flex-direction: column; gap: 3px; min-width: 96px; }
    .stat-label { font-size: 0.66rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
    .stat-val { font-weight: 700; color: var(--ink); }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-weight: 700; font-size: 0.78rem; }
    .badge-hit { background: rgba(244, 63, 94, 0.18); color: var(--accent-red); }
    .badge-ok  { background: rgba(74, 222, 128, 0.18); color: var(--accent-green); }
    .pass { color: var(--accent-green); }
    .fail { color: var(--accent-red); }
  </style>
</head>
<body>
  <div class="demo-wrap">
    <div class="canvas-container">
      <canvas id="boxCanvas"></canvas>
      <div class="hint">Drag the robot, the obstacle, or the ghost end-of-tick pose</div>
    </div>

    <div class="controls">
      <label>Obstacle width
        <input type="range" id="obsW" min="0.2" max="3.0" step="0.1" value="1.4">
        <span id="obsWVal" style="font-family: ui-monospace, monospace;">1.4 m</span>
      </label>
      <label><input type="checkbox" id="showInflate"> Inflate obstacle, robot becomes a point</label>
      <label><input type="checkbox" id="showSwept"> Swept box (tunneling)</label>
    </div>

    <div class="stats-row">
      <div class="stat-item">
        <span class="stat-label">Instantaneous</span>
        <span id="statusBadge" class="badge badge-ok">Clear</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">X intervals overlap?</span>
        <span class="stat-val" id="xTest">—</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Y intervals overlap?</span>
        <span class="stat-val" id="yTest">—</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Overlap w × h</span>
        <span class="stat-val" id="overlapVal">0.00 × 0.00</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Penetration (min axis)</span>
        <span class="stat-val" id="penVal">0.00 m</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">IoU</span>
        <span class="stat-val" id="iouVal" style="color: var(--accent-amber);">0.000</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Swept box verdict</span>
        <span class="stat-val" id="sweptVal">off</span>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('boxCanvas');
    const ctx = canvas.getContext('2d');

    const FIELD_X = 8.0, FIELD_Y = 5.0, PAD = 34;
    const ROBOT_W = 0.9, ROBOT_L = 0.9;

    let robot = { x: 2.0, y: 2.5 };
    let robotNext = { x: 3.1, y: 2.5 };     // ghost pose one tick later
    let obstacle = { x: 5.0, y: 2.6 };
    let obsW = 1.4, obsH = 1.8;
    let dragging = null;

    const obsWSlider = document.getElementById('obsW');
    const showInflate = document.getElementById('showInflate');
    const showSwept = document.getElementById('showSwept');

    // ---- Box helpers -------------------------------------------------------
    const fromCenter = (c, w, h) => ({
      minX: c.x - w / 2, minY: c.y - h / 2, maxX: c.x + w / 2, maxY: c.y + h / 2
    });
    const overlaps = (a, b) =>
      a.maxX >= b.minX && b.maxX >= a.minX && a.maxY >= b.minY && b.maxY >= a.minY;
    const intersection = (a, b) => ({
      minX: Math.max(a.minX, b.minX), minY: Math.max(a.minY, b.minY),
      maxX: Math.min(a.maxX, b.maxX), maxY: Math.min(a.maxY, b.maxY)
    });
    const area = (b) => Math.max(0, b.maxX - b.minX) * Math.max(0, b.maxY - b.minY);
    const inflate = (b, hx, hy) => ({
      minX: b.minX - hx, minY: b.minY - hy, maxX: b.maxX + hx, maxY: b.maxY + hy
    });
    const swept = (a, b) => ({
      minX: Math.min(a.minX, b.minX), minY: Math.min(a.minY, b.minY),
      maxX: Math.max(a.maxX, b.maxX), maxY: Math.max(a.maxY, b.maxY)
    });

    function cssSize() {
      const dpr = window.devicePixelRatio || 1;
      return { w: canvas.width / dpr, h: canvas.height / dpr };
    }
    function view() {
      const { w, h } = cssSize();
      const scale = Math.min((w - PAD * 2) / FIELD_X, (h - PAD * 2) / FIELD_Y);
      return { scale, ox: (w - FIELD_X * scale) / 2, oy: (h + FIELD_Y * scale) / 2 };
    }
    const sx = (mx) => view().ox + mx * view().scale;
    const sy = (my) => view().oy - my * view().scale;
    const toMeters = (px, py) => {
      const v = view();
      return {
        x: Math.max(0, Math.min(FIELD_X, (px - v.ox) / v.scale)),
        y: Math.max(0, Math.min(FIELD_Y, (v.oy - py) / v.scale))
      };
    };

    function resize() {
      const rect = canvas.parentElement.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      draw();
    }

    function palette() {
      const light = document.documentElement.getAttribute('data-theme') === 'light';
      return {
        light,
        grid:  light ? 'rgba(0,0,0,0.05)' : 'rgba(255,255,255,0.035)',
        line:  light ? '#cbd5e1' : '#232b3b',
        muted: light ? '#64748b' : '#94a3b8',
        blue:  light ? '#0284c7' : '#38bdf8',
        red:   light ? '#e11d48' : '#f43f5e',
        green: light ? '#16a34a' : '#4ade80',
        amber: light ? '#d97706' : '#fbbf24',
        purple:light ? '#9333ea' : '#c084fc'
      };
    }

    function strokeBox(b, color, width, dash, fill) {
      ctx.save();
      ctx.setLineDash(dash || []);
      const x = sx(b.minX), y = sy(b.maxY);
      const w = sx(b.maxX) - x, h = sy(b.minY) - y;
      if (fill) { ctx.fillStyle = fill; ctx.fillRect(x, y, w, h); }
      ctx.strokeStyle = color; ctx.lineWidth = width;
      ctx.strokeRect(x, y, w, h);
      ctx.restore();
    }

    function draw() {
      const C = palette();
      const { w, h } = cssSize();
      ctx.clearRect(0, 0, w, h);

      ctx.strokeStyle = C.grid; ctx.lineWidth = 1;
      for (let x = 1; x < FIELD_X; x++) {
        ctx.beginPath(); ctx.moveTo(sx(x), sy(0)); ctx.lineTo(sx(x), sy(FIELD_Y)); ctx.stroke();
      }
      for (let y = 1; y < FIELD_Y; y++) {
        ctx.beginPath(); ctx.moveTo(sx(0), sy(y)); ctx.lineTo(sx(FIELD_X), sy(y)); ctx.stroke();
      }
      ctx.strokeStyle = C.line; ctx.lineWidth = 2;
      ctx.strokeRect(sx(0), sy(FIELD_Y), sx(FIELD_X) - sx(0), sy(0) - sy(FIELD_Y));

      const rBox = fromCenter(robot, ROBOT_W, ROBOT_L);
      const nBox = fromCenter(robotNext, ROBOT_W, ROBOT_L);
      const oBox = fromCenter(obstacle, obsW, obsH);

      // Obstacle, optionally inflated by the robot's half-extents
      if (showInflate.checked) {
        strokeBox(inflate(oBox, ROBOT_W / 2, ROBOT_L / 2), C.purple, 2, [6, 4],
                  C.light ? 'rgba(147,51,234,0.07)' : 'rgba(192,132,252,0.08)');
      }
      strokeBox(oBox, C.red, 2, [], C.light ? 'rgba(225,29,72,0.14)' : 'rgba(244,63,94,0.16)');

      // Swept box across the tick
      let sweptHit = null;
      if (showSwept.checked) {
        const sBox = swept(rBox, nBox);
        sweptHit = overlaps(sBox, oBox);
        strokeBox(sBox, C.amber, 2, [7, 5],
                  C.light ? 'rgba(217,119,6,0.07)' : 'rgba(251,191,36,0.08)');
        strokeBox(nBox, C.blue, 1.5, [3, 3]);
      }

      // Robot: a box normally, a single point once the obstacle has absorbed its size
      if (showInflate.checked) {
        ctx.fillStyle = C.blue;
        ctx.beginPath(); ctx.arc(sx(robot.x), sy(robot.y), 7, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.stroke();
      } else {
        strokeBox(rBox, C.blue, 2, [], C.light ? 'rgba(2,132,199,0.14)' : 'rgba(56,189,248,0.16)');
      }

      // Overlap rectangle
      const inter = intersection(rBox, oBox);
      const hit = overlaps(rBox, oBox);
      if (hit) {
        strokeBox(inter, C.green, 2, [],
                  C.light ? 'rgba(22,163,74,0.30)' : 'rgba(74,222,128,0.28)');
      }

      // Interval shadows projected onto the axes — the separating-axis picture
      const axisY = sy(0) + 14, axisX = sx(0) - 16;
      const bar = (x1, x2, yy, color) => {
        ctx.strokeStyle = color; ctx.lineWidth = 5; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(sx(x1), yy); ctx.lineTo(sx(x2), yy); ctx.stroke();
      };
      const vbar = (y1, y2, xx, color) => {
        ctx.strokeStyle = color; ctx.lineWidth = 5; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(xx, sy(y1)); ctx.lineTo(xx, sy(y2)); ctx.stroke();
      };
      bar(rBox.minX, rBox.maxX, axisY, C.blue);
      bar(oBox.minX, oBox.maxX, axisY + 8, C.red);
      vbar(rBox.minY, rBox.maxY, axisX, C.blue);
      vbar(oBox.minY, oBox.maxY, axisX - 8, C.red);

      updateStats(rBox, oBox, inter, hit, sweptHit);
    }

    function updateStats(rBox, oBox, inter, hit, sweptHit) {
      const set = (id, v) => document.getElementById(id).textContent = v;
      const xOver = rBox.maxX >= oBox.minX && oBox.maxX >= rBox.minX;
      const yOver = rBox.maxY >= oBox.minY && oBox.maxY >= rBox.minY;

      const mark = (id, ok) => {
        const el = document.getElementById(id);
        el.textContent = ok ? 'yes' : 'no (separating)';
        el.className = 'stat-val ' + (ok ? 'pass' : 'fail');
      };
      mark('xTest', xOver);
      mark('yTest', yOver);

      const ow = Math.max(0, inter.maxX - inter.minX);
      const oh = Math.max(0, inter.maxY - inter.minY);
      set('overlapVal', ow.toFixed(2) + ' × ' + oh.toFixed(2));
      set('penVal', hit ? Math.min(ow, oh).toFixed(2) + ' m' : '0.00 m');

      const interA = ow * oh;
      const unionA = area(rBox) + area(oBox) - interA;
      set('iouVal', (unionA <= 0 ? 0 : interA / unionA).toFixed(3));

      set('sweptVal', sweptHit === null ? 'off' : (sweptHit ? 'COLLIDES' : 'clear'));
      document.getElementById('sweptVal').className =
        'stat-val ' + (sweptHit === null ? '' : (sweptHit ? 'fail' : 'pass'));

      const badge = document.getElementById('statusBadge');
      badge.textContent = hit ? 'Collision' : 'Clear';
      badge.className = 'badge ' + (hit ? 'badge-hit' : 'badge-ok');
    }

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const p = e.touches && e.touches.length ? e.touches[0] : e;
      return { x: p.clientX - rect.left, y: p.clientY - rect.top };
    }

    function startDrag(e) {
      const pos = getPos(e);
      const targets = [['robot', robot], ['obstacle', obstacle]];
      if (showSwept.checked) targets.push(['robotNext', robotNext]);
      let best = null, bestDist = 34;
      for (const [name, pt] of targets) {
        const d = Math.hypot(pos.x - sx(pt.x), pos.y - sy(pt.y));
        if (d < bestDist) { bestDist = d; best = name; }
      }
      dragging = best;
    }

    function moveDrag(e) {
      if (!dragging) return;
      if (e.cancelable) e.preventDefault();
      const pos = getPos(e);
      const m = toMeters(pos.x, pos.y);
      if (dragging === 'robot') robot = m;
      else if (dragging === 'obstacle') obstacle = m;
      else robotNext = m;
      draw();
    }

    canvas.addEventListener('mousedown', startDrag);
    window.addEventListener('mousemove', moveDrag);
    window.addEventListener('mouseup', () => dragging = null);
    canvas.addEventListener('touchstart', startDrag, { passive: true });
    window.addEventListener('touchmove', moveDrag, { passive: false });
    window.addEventListener('touchend', () => dragging = null);

    obsWSlider.addEventListener('input', () => {
      obsW = parseFloat(obsWSlider.value);
      document.getElementById('obsWVal').textContent = obsW.toFixed(1) + ' m';
      draw();
    });
    showInflate.addEventListener('change', draw);
    showSwept.addEventListener('change', draw);

    window.addEventListener('resize', resize);
    window.addEventListener('axon-theme-changed', draw);
    resize();
  </script>
</body>
</html>
