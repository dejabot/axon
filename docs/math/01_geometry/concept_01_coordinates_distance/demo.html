<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Concept 01: 2D Field Distance Visualizer</title>
  <script src="../../../assets/theme.js"></script>
  <link rel="stylesheet" href="../../../assets/axon.css">
  <style>
    .demo-wrap {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 12px;
    }
    .canvas-container {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      position: relative;
      overflow: hidden;
      min-height: 340px;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }
    .stats-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 12px 16px;
      border-radius: 10px;
      font-family: ui-monospace, "SF Mono", monospace;
      font-size: 0.85rem;
    }
    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .stat-label {
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
    }
    .stat-val {
      font-weight: 700;
      color: var(--ink);
    }
  </style>
</head>
<body>
  <div class="demo-wrap">
    <div class="canvas-container">
      <canvas id="fieldCanvas"></canvas>
    </div>
    
    <div class="stats-row">
      <div class="stat-item">
        <span class="stat-label">Robot (x₁, y₁)</span>
        <span class="stat-val" id="robotPosText" style="color: var(--accent);">[3.0, 2.0] m</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Target (x₂, y₂)</span>
        <span class="stat-val" id="targetPosText" style="color: var(--accent-red);">[12.0, 6.0] m</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Δx (East/West)</span>
        <span class="stat-val" id="dxText">9.00 m</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Δy (North/South)</span>
        <span class="stat-val" id="dyText">4.00 m</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Straight-Line Distance</span>
        <span class="stat-val" id="distText" style="color: var(--accent-amber); font-size: 1.05rem;">9.85 m</span>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('fieldCanvas');
    const ctx = canvas.getContext('2d');

    const fieldMetersX = 16.5;
    const fieldMetersY = 8.2;

    let robot = { x: 3.0, y: 2.0 };
    let target = { x: 12.0, y: 6.0 };
    let dragging = null;

    function resize() {
      const rect = canvas.parentElement.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      draw();
    }
    window.addEventListener('resize', resize);
    window.addEventListener('axon-theme-changed', draw);

    function toScreen(mx, my) {
      const pad = 30;
      const w = (canvas.width / (window.devicePixelRatio || 1)) - pad * 2;
      const h = (canvas.height / (window.devicePixelRatio || 1)) - pad * 2;
      return {
        x: pad + (mx / fieldMetersX) * w,
        y: pad + h - (my / fieldMetersY) * h
      };
    }

    function toMeters(sx, sy) {
      const pad = 30;
      const w = (canvas.width / (window.devicePixelRatio || 1)) - pad * 2;
      const h = (canvas.height / (window.devicePixelRatio || 1)) - pad * 2;
      return {
        x: Math.max(0, Math.min(fieldMetersX, ((sx - pad) / w) * fieldMetersX)),
        y: Math.max(0, Math.min(fieldMetersY, (1.0 - (sy - pad) / h) * fieldMetersY))
      };
    }

    function draw() {
      const isLight = document.documentElement.getAttribute('data-theme') === 'light';
      const width = canvas.width / (window.devicePixelRatio || 1);
      const height = canvas.height / (window.devicePixelRatio || 1);

      ctx.clearRect(0, 0, width, height);

      // Draw Field Border
      const tl = toScreen(0, fieldMetersY);
      const br = toScreen(fieldMetersX, 0);
      ctx.strokeStyle = isLight ? '#cbd5e1' : '#232b3b';
      ctx.lineWidth = 2;
      ctx.strokeRect(tl.x, tl.y, br.x - tl.x, br.y - tl.y);

      // Grid lines every 2m
      ctx.strokeStyle = isLight ? 'rgba(0,0,0,0.04)' : 'rgba(255,255,255,0.03)';
      ctx.lineWidth = 1;
      for (let x = 2; x < fieldMetersX; x += 2) {
        const p1 = toScreen(x, 0);
        const p2 = toScreen(x, fieldMetersY);
        ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
      }
      for (let y = 2; y < fieldMetersY; y += 2) {
        const p1 = toScreen(0, y);
        const p2 = toScreen(fieldMetersX, y);
        ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
      }

      const rScr = toScreen(robot.x, robot.y);
      const tScr = toScreen(target.x, target.y);
      const cornerScr = toScreen(target.x, robot.y);

      // Triangle components
      ctx.setLineDash([4, 4]);
      ctx.strokeStyle = isLight ? 'rgba(2, 132, 199, 0.4)' : 'rgba(56, 189, 248, 0.3)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(rScr.x, rScr.y);
      ctx.lineTo(cornerScr.x, cornerScr.y);
      ctx.lineTo(tScr.x, tScr.y);
      ctx.stroke();
      ctx.setLineDash([]);

      // Straight-line distance
      ctx.strokeStyle = isLight ? '#d97706' : '#fbbf24';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(rScr.x, rScr.y);
      ctx.lineTo(tScr.x, tScr.y);
      ctx.stroke();

      // Robot box
      ctx.fillStyle = isLight ? '#0284c7' : '#38bdf8';
      ctx.fillRect(rScr.x - 12, rScr.y - 12, 24, 24);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.strokeRect(rScr.x - 12, rScr.y - 12, 24, 24);

      // Target circle
      ctx.fillStyle = isLight ? '#e11d48' : '#f43f5e';
      ctx.beginPath();
      ctx.arc(tScr.x, tScr.y, 9, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Labels
      ctx.font = '12px system-ui, sans-serif';
      ctx.fillStyle = isLight ? '#0284c7' : '#38bdf8';
      ctx.fillText('Robot', rScr.x - 16, rScr.y - 16);
      ctx.fillStyle = isLight ? '#e11d48' : '#f43f5e';
      ctx.fillText('Target', tScr.x - 16, tScr.y - 14);

      // Update Text
      const dx = target.x - robot.x;
      const dy = target.y - robot.y;
      const dist = Math.hypot(dx, dy);

      document.getElementById('robotPosText').textContent = `[${robot.x.toFixed(1)}, ${robot.y.toFixed(1)}] m`;
      document.getElementById('targetPosText').textContent = `[${target.x.toFixed(1)}, ${target.y.toFixed(1)}] m`;
      document.getElementById('dxText').textContent = `${dx >= 0 ? '+' : ''}${dx.toFixed(2)} m`;
      document.getElementById('dyText').textContent = `${dy >= 0 ? '+' : ''}${dy.toFixed(2)} m`;
      document.getElementById('distText').textContent = `${dist.toFixed(2)} m`;
    }

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: cx - rect.left, y: cy - rect.top };
    }

    canvas.addEventListener('mousedown', (e) => {
      const p = getPos(e);
      const rScr = toScreen(robot.x, robot.y);
      const tScr = toScreen(target.x, target.y);
      if (Math.hypot(p.x - rScr.x, p.y - rScr.y) < 25) dragging = 'robot';
      else if (Math.hypot(p.x - tScr.x, p.y - tScr.y) < 25) dragging = 'target';
    });

    window.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      const p = getPos(e);
      const m = toMeters(p.x, p.y);
      if (dragging === 'robot') { robot.x = m.x; robot.y = m.y; }
      if (dragging === 'target') { target.x = m.x; target.y = m.y; }
      draw();
    });

    window.addEventListener('mouseup', () => dragging = null);

    canvas.addEventListener('touchstart', (e) => {
      const p = getPos(e);
      const rScr = toScreen(robot.x, robot.y);
      const tScr = toScreen(target.x, target.y);
      if (Math.hypot(p.x - rScr.x, p.y - rScr.y) < 30) dragging = 'robot';
      else if (Math.hypot(p.x - tScr.x, p.y - tScr.y) < 30) dragging = 'target';
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (!dragging) return;
      e.preventDefault();
      const p = getPos(e);
      const m = toMeters(p.x, p.y);
      if (dragging === 'robot') { robot.x = m.x; robot.y = m.y; }
      if (dragging === 'target') { target.x = m.x; target.y = m.y; }
      draw();
    }, { passive: false });

    window.addEventListener('touchend', () => dragging = null);

    resize();
  </script>
</body>
</html>
