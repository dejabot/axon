<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Concept 02: Dot Product & Projection Visualizer</title>
  <script src="../../../assets/theme.js"></script>
  <link rel="stylesheet" href="../../../assets/axon.css">
  <style>
    .demo-wrap {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 12px;
    }
    .canvas-container {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      position: relative;
      overflow: hidden;
      min-height: 340px;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }
    .stats-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 12px 16px;
      border-radius: 10px;
      font-family: ui-monospace, "SF Mono", monospace;
      font-size: 0.85rem;
    }
    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .stat-label {
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
    }
    .stat-val {
      font-weight: 700;
      color: var(--ink);
    }
  </style>
</head>
<body>
  <div class="demo-wrap">
    <div class="canvas-container">
      <canvas id="dotCanvas"></canvas>
    </div>
    
    <div class="stats-row">
      <div class="stat-item">
        <span class="stat-label">Vector u (Cyan)</span>
        <span class="stat-val" id="uText" style="color: var(--accent);">[3.0, 0.0]</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Vector v (Amber)</span>
        <span class="stat-val" id="vText" style="color: var(--accent-amber);">[2.0, 2.0]</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Angle θ</span>
        <span class="stat-val" id="angleText">45.0°</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Dot Product (u · v)</span>
        <span class="stat-val" id="dotText" style="color: var(--accent-green); font-size: 1.05rem;">+6.00</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Alignment Status</span>
        <span class="stat-val" id="alignStatusText" style="color: var(--accent);">Acute (&lt; 90°)</span>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('dotCanvas');
    const ctx = canvas.getContext('2d');

    let vecU = { x: 3.0, y: 0.0 };
    let vecV = { x: 2.0, y: 2.0 };
    let dragging = null;

    function resize() {
      const rect = canvas.parentElement.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      draw();
    }
    window.addEventListener('resize', resize);
    window.addEventListener('axon-theme-changed', draw);

    function toScreen(mx, my) {
      const cx = (canvas.width / (window.devicePixelRatio || 1)) / 2;
      const cy = (canvas.height / (window.devicePixelRatio || 1)) / 2;
      const scale = 36;
      return { x: cx + mx * scale, y: cy - my * scale };
    }

    function toMath(sx, sy) {
      const cx = (canvas.width / (window.devicePixelRatio || 1)) / 2;
      const cy = (canvas.height / (window.devicePixelRatio || 1)) / 2;
      const scale = 36;
      return {
        x: (sx - cx) / scale,
        y: -(sy - cy) / scale
      };
    }

    function drawArrow(from, to, color, width = 3) {
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = width;
      ctx.beginPath();
      ctx.moveTo(from.x, from.y);
      ctx.lineTo(to.x, to.y);
      ctx.stroke();

      const angle = Math.atan2(to.y - from.y, to.x - from.x);
      const head = 8;
      ctx.beginPath();
      ctx.moveTo(to.x, to.y);
      ctx.lineTo(to.x - head * Math.cos(angle - Math.PI / 6), to.y - head * Math.sin(angle - Math.PI / 6));
      ctx.lineTo(to.x - head * Math.cos(angle + Math.PI / 6), to.y - head * Math.sin(angle + Math.PI / 6));
      ctx.closePath();
      ctx.fill();
    }

    function draw() {
      const isLight = document.documentElement.getAttribute('data-theme') === 'light';
      const width = canvas.width / (window.devicePixelRatio || 1);
      const height = canvas.height / (window.devicePixelRatio || 1);

      ctx.clearRect(0, 0, width, height);

      const o = toScreen(0, 0);

      // Axes
      ctx.strokeStyle = isLight ? '#cbd5e1' : '#232b3b';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(20, o.y); ctx.lineTo(width - 20, o.y);
      ctx.moveTo(o.x, 20); ctx.lineTo(o.x, height - 20);
      ctx.stroke();

      const uTip = toScreen(vecU.x, vecU.y);
      const vTip = toScreen(vecV.x, vecV.y);

      // Projection of V onto U
      const uLenSq = vecU.x * vecU.x + vecU.y * vecU.y;
      let projX = 0, projY = 0;
      if (uLenSq > 0.001) {
        const dot = vecU.x * vecV.x + vecU.y * vecV.y;
        projX = (dot / uLenSq) * vecU.x;
        projY = (dot / uLenSq) * vecU.y;
      }
      const projTip = toScreen(projX, projY);

      // Dashed projection drop line
      ctx.setLineDash([3, 3]);
      ctx.strokeStyle = isLight ? '#16a34a' : '#4ade80';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(vTip.x, vTip.y);
      ctx.lineTo(projTip.x, projTip.y);
      ctx.stroke();
      ctx.setLineDash([]);

      // Projection shadow line
      ctx.strokeStyle = isLight ? 'rgba(22, 163, 74, 0.6)' : 'rgba(74, 222, 128, 0.6)';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(o.x, o.y);
      ctx.lineTo(projTip.x, projTip.y);
      ctx.stroke();

      // Vectors U and V
      drawArrow(o, uTip, isLight ? '#0284c7' : '#38bdf8', 3.5);
      drawArrow(o, vTip, isLight ? '#d97706' : '#fbbf24', 3.5);

      // Knobs
      ctx.fillStyle = isLight ? '#0284c7' : '#38bdf8';
      ctx.beginPath(); ctx.arc(uTip.x, uTip.y, 7, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();

      ctx.fillStyle = isLight ? '#d97706' : '#fbbf24';
      ctx.beginPath(); ctx.arc(vTip.x, vTip.y, 7, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();

      // Telemetry
      const dot = vecU.x * vecV.x + vecU.y * vecV.y;
      const uLen = Math.hypot(vecU.x, vecU.y);
      const vLen = Math.hypot(vecV.x, vecV.y);
      let angleDeg = 0;
      if (uLen > 0 && vLen > 0) {
        const cosTheta = Math.max(-1, Math.min(1, dot / (uLen * vLen)));
        angleDeg = Math.acos(cosTheta) * 180 / Math.PI;
      }

      let status = "Acute (< 90°)";
      if (Math.abs(angleDeg - 90) < 1.5) status = "Perpendicular (Orthogonal)";
      else if (angleDeg > 90) status = "Obtuse (> 90°)";

      document.getElementById('uText').textContent = `[${vecU.x.toFixed(1)}, ${vecU.y.toFixed(1)}]`;
      document.getElementById('vText').textContent = `[${vecV.x.toFixed(1)}, ${vecV.y.toFixed(1)}]`;
      document.getElementById('angleText').textContent = `${angleDeg.toFixed(1)}°`;
      document.getElementById('dotText').textContent = `${dot >= 0 ? '+' : ''}${dot.toFixed(2)}`;
      document.getElementById('alignStatusText').textContent = status;
    }

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: cx - rect.left, y: cy - rect.top };
    }

    canvas.addEventListener('mousedown', (e) => {
      const p = getPos(e);
      const uTip = toScreen(vecU.x, vecU.y);
      const vTip = toScreen(vecV.x, vecV.y);
      if (Math.hypot(p.x - uTip.x, p.y - uTip.y) < 20) dragging = 'U';
      else if (Math.hypot(p.x - vTip.x, p.y - vTip.y) < 20) dragging = 'V';
    });

    window.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      const p = getPos(e);
      const m = toMath(p.x, p.y);
      if (dragging === 'U') { vecU.x = Math.round(m.x * 2) / 2; vecU.y = Math.round(m.y * 2) / 2; }
      if (dragging === 'V') { vecV.x = Math.round(m.x * 2) / 2; vecV.y = Math.round(m.y * 2) / 2; }
      draw();
    });

    window.addEventListener('mouseup', () => dragging = null);

    canvas.addEventListener('touchstart', (e) => {
      const p = getPos(e);
      const uTip = toScreen(vecU.x, vecU.y);
      const vTip = toScreen(vecV.x, vecV.y);
      if (Math.hypot(p.x - uTip.x, p.y - uTip.y) < 25) dragging = 'U';
      else if (Math.hypot(p.x - vTip.x, p.y - vTip.y) < 25) dragging = 'V';
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (!dragging) return;
      e.preventDefault();
      const p = getPos(e);
      const m = toMath(p.x, p.y);
      if (dragging === 'U') { vecU.x = Math.round(m.x * 2) / 2; vecU.y = Math.round(m.y * 2) / 2; }
      if (dragging === 'V') { vecV.x = Math.round(m.x * 2) / 2; vecV.y = Math.round(m.y * 2) / 2; }
      draw();
    }, { passive: false });

    window.addEventListener('touchend', () => dragging = null);

    resize();
  </script>
</body>
</html>
