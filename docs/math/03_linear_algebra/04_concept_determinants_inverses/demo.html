<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Concept 04: Determinant & Inverse Visualizer</title>
  <script src="../../../assets/theme.js"></script>
  <link rel="stylesheet" href="../../../assets/axon.css">
  <style>
    .demo-wrap {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 12px;
    }
    .canvas-container {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      position: relative;
      overflow: hidden;
      min-height: 340px;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }
    .stats-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 12px 16px;
      border-radius: 10px;
      font-family: ui-monospace, "SF Mono", monospace;
      font-size: 0.85rem;
    }
    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .stat-label {
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
    }
    .stat-val {
      font-weight: 700;
      color: var(--ink);
    }
    .badge {
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: 700;
      text-transform: uppercase;
      font-size: 0.8rem;
    }
    .badge-ok { background: rgba(74, 222, 128, 0.2); color: var(--accent-green); }
    .badge-danger { background: rgba(244, 63, 94, 0.2); color: var(--accent-red); }
  </style>
</head>
<body>
  <div class="demo-wrap">
    <div class="canvas-container">
      <canvas id="detCanvas"></canvas>
    </div>
    
    <div class="stats-row">
      <div class="stat-item">
        <span class="stat-label">Matrix [ A ]</span>
        <span class="stat-val" id="matText" style="color: var(--accent);">[[1.5, 0.0], [0.0, 1.5]]</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Determinant (det A)</span>
        <span class="stat-val" id="detValText" style="color: var(--accent-amber);">+2.25</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Invertibility Status</span>
        <span id="statusBadge" class="badge badge-ok">Invertible</span>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('detCanvas');
    const ctx = canvas.getContext('2d');

    let col1 = { x: 1.5, y: 0.0 };
    let col2 = { x: 0.0, y: 1.5 };
    let dragging = null;

    function resize() {
      const rect = canvas.parentElement.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      draw();
    }
    window.addEventListener('resize', resize);
    window.addEventListener('axon-theme-changed', draw);

    function toScreen(mx, my) {
      const cx = (canvas.width / (window.devicePixelRatio || 1)) / 2;
      const cy = (canvas.height / (window.devicePixelRatio || 1)) / 2;
      const scale = 45;
      return { x: cx + mx * scale, y: cy - my * scale };
    }

    function toMath(sx, sy) {
      const cx = (canvas.width / (window.devicePixelRatio || 1)) / 2;
      const cy = (canvas.height / (window.devicePixelRatio || 1)) / 2;
      const scale = 45;
      return { x: (sx - cx) / scale, y: -(sy - cy) / scale };
    }

    function drawArrow(from, to, color, width = 3) {
      ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = width;
      ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(to.x, to.y); ctx.stroke();
      const angle = Math.atan2(to.y - from.y, to.x - from.x);
      const head = 8;
      ctx.beginPath();
      ctx.moveTo(to.x, to.y);
      ctx.lineTo(to.x - head * Math.cos(angle - Math.PI / 6), to.y - head * Math.sin(angle - Math.PI / 6));
      ctx.lineTo(to.x - head * Math.cos(angle + Math.PI / 6), to.y - head * Math.sin(angle + Math.PI / 6));
      ctx.closePath(); ctx.fill();
    }

    function draw() {
      const isLight = document.documentElement.getAttribute('data-theme') === 'light';
      const width = canvas.width / (window.devicePixelRatio || 1);
      const height = canvas.height / (window.devicePixelRatio || 1);

      ctx.clearRect(0, 0, width, height);

      const o = toScreen(0, 0);

      // Axes
      ctx.strokeStyle = isLight ? '#cbd5e1' : '#232b3b';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(20, o.y); ctx.lineTo(width - 20, o.y);
      ctx.moveTo(o.x, 20); ctx.lineTo(o.x, height - 20);
      ctx.stroke();

      const p1 = toScreen(col1.x, col1.y);
      const p2 = toScreen(col2.x, col2.y);
      const pSum = toScreen(col1.x + col2.x, col1.y + col2.y);

      const det = col1.x * col2.y - col1.y * col2.x;
      const isSingular = Math.abs(det) < 0.08;

      // Parallelogram Area
      ctx.fillStyle = isSingular
        ? 'rgba(244, 63, 94, 0.3)'
        : (det > 0 ? (isLight ? 'rgba(22, 163, 74, 0.2)' : 'rgba(74, 222, 128, 0.18)')
                   : (isLight ? 'rgba(147, 51, 234, 0.2)' : 'rgba(192, 132, 252, 0.18)'));
      ctx.beginPath();
      ctx.moveTo(o.x, o.y); ctx.lineTo(p1.x, p1.y); ctx.lineTo(pSum.x, pSum.y); ctx.lineTo(p2.x, p2.y);
      ctx.closePath(); ctx.fill();

      // Vectors
      drawArrow(o, p1, isLight ? '#16a34a' : '#4ade80', 3.5);
      drawArrow(o, p2, isLight ? '#e11d48' : '#f43f5e', 3.5);

      // Knobs
      ctx.fillStyle = isLight ? '#16a34a' : '#4ade80';
      ctx.beginPath(); ctx.arc(p1.x, p1.y, 7, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();

      ctx.fillStyle = isLight ? '#e11d48' : '#f43f5e';
      ctx.beginPath(); ctx.arc(p2.x, p2.y, 7, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();

      // Telemetry
      document.getElementById('matText').textContent = `[[${col1.x.toFixed(1)}, ${col2.x.toFixed(1)}], [${col1.y.toFixed(1)}, ${col2.y.toFixed(1)}]]`;
      document.getElementById('detValText').textContent = `${det >= 0 ? '+' : ''}${det.toFixed(2)}`;

      const badge = document.getElementById('statusBadge');
      if (isSingular) {
        badge.className = 'badge badge-danger';
        badge.textContent = 'Singular (Det ≈ 0 / No Inverse)';
      } else {
        badge.className = 'badge badge-ok';
        badge.textContent = 'Invertible (Area > 0)';
      }
    }

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: cx - rect.left, y: cy - rect.top };
    }

    canvas.addEventListener('mousedown', (e) => {
      const p = getPos(e);
      const p1 = toScreen(col1.x, col1.y);
      const p2 = toScreen(col2.x, col2.y);
      if (Math.hypot(p.x - p1.x, p.y - p1.y) < 20) dragging = '1';
      else if (Math.hypot(p.x - p2.x, p.y - p2.y) < 20) dragging = '2';
    });

    window.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      const p = getPos(e);
      const m = toMath(p.x, p.y);
      if (dragging === '1') { col1.x = Math.round(m.x * 2) / 2; col1.y = Math.round(m.y * 2) / 2; }
      if (dragging === '2') { col2.x = Math.round(m.x * 2) / 2; col2.y = Math.round(m.y * 2) / 2; }
      draw();
    });

    window.addEventListener('mouseup', () => dragging = null);

    canvas.addEventListener('touchstart', (e) => {
      const p = getPos(e);
      const p1 = toScreen(col1.x, col1.y);
      const p2 = toScreen(col2.x, col2.y);
      if (Math.hypot(p.x - p1.x, p.y - p1.y) < 25) dragging = '1';
      else if (Math.hypot(p.x - p2.x, p.y - p2.y) < 25) dragging = '2';
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (!dragging) return;
      e.preventDefault();
      const p = getPos(e);
      const m = toMath(p.x, p.y);
      if (dragging === '1') { col1.x = Math.round(m.x * 2) / 2; col1.y = Math.round(m.y * 2) / 2; }
      if (dragging === '2') { col2.x = Math.round(m.x * 2) / 2; col2.y = Math.round(m.y * 2) / 2; }
      draw();
    }, { passive: false });

    window.addEventListener('touchend', () => dragging = null);

    resize();
  </script>
</body>
</html>
