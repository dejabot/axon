<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Concept 08: Vector Addition Visualizer</title>
  <script src="../../../assets/theme.js"></script>
  <link rel="stylesheet" href="../../../assets/axon.css">
  <style>
    .demo-wrap {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 12px;
    }
    .canvas-container {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      position: relative;
      overflow: hidden;
      min-height: 340px;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }
    .controls-row {
      display: flex;
      gap: 16px;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 0.85rem;
    }
    input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
    }
    .stats-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 12px 16px;
      border-radius: 10px;
      font-family: ui-monospace, "SF Mono", monospace;
      font-size: 0.85rem;
    }
    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .stat-label {
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
    }
    .stat-val {
      font-weight: 700;
      color: var(--ink);
    }
  </style>
</head>
<body>
  <div class="demo-wrap">
    <div class="canvas-container">
      <canvas id="vecCanvas"></canvas>
    </div>

    <div class="controls-row">
      <label>Scalar Multiplier (k): <b id="scalarLabel" style="color: var(--accent-amber);">1.0x</b></label>
      <input type="range" id="scalarSlider" min="0.2" max="2.0" step="0.1" value="1.0">
    </div>
    
    <div class="stats-row">
      <div class="stat-item">
        <span class="stat-label">Vector A (Cyan)</span>
        <span class="stat-val" id="vecAText" style="color: var(--accent);">[2.0, 1.0]</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Vector B (Green)</span>
        <span class="stat-val" id="vecBText" style="color: var(--accent-green);">[1.0, 2.0]</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Result: k · (A + B)</span>
        <span class="stat-val" id="vecSumText" style="color: var(--accent-amber); font-size: 1.05rem;">[3.0, 3.0]</span>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('vecCanvas');
    const ctx = canvas.getContext('2d');

    let vecA = { x: 2.0, y: 1.0 };
    let vecB = { x: 1.0, y: 2.0 };
    let scalar = 1.0;
    let dragging = null;

    function resize() {
      const rect = canvas.parentElement.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      draw();
    }
    window.addEventListener('resize', resize);
    window.addEventListener('axon-theme-changed', draw);

    function toScreen(mx, my) {
      const cx = (canvas.width / (window.devicePixelRatio || 1)) / 2;
      const cy = (canvas.height / (window.devicePixelRatio || 1)) / 2;
      const scale = 38;
      return { x: cx + mx * scale, y: cy - my * scale };
    }

    function toMath(sx, sy) {
      const cx = (canvas.width / (window.devicePixelRatio || 1)) / 2;
      const cy = (canvas.height / (window.devicePixelRatio || 1)) / 2;
      const scale = 38;
      return {
        x: (sx - cx) / scale,
        y: -(sy - cy) / scale
      };
    }

    function drawArrow(from, to, color, width = 3) {
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = width;
      ctx.beginPath();
      ctx.moveTo(from.x, from.y);
      ctx.lineTo(to.x, to.y);
      ctx.stroke();

      const angle = Math.atan2(to.y - from.y, to.x - from.x);
      const head = 8;
      ctx.beginPath();
      ctx.moveTo(to.x, to.y);
      ctx.lineTo(to.x - head * Math.cos(angle - Math.PI / 6), to.y - head * Math.sin(angle - Math.PI / 6));
      ctx.lineTo(to.x - head * Math.cos(angle + Math.PI / 6), to.y - head * Math.sin(angle + Math.PI / 6));
      ctx.closePath();
      ctx.fill();
    }

    function draw() {
      const isLight = document.documentElement.getAttribute('data-theme') === 'light';
      const width = canvas.width / (window.devicePixelRatio || 1);
      const height = canvas.height / (window.devicePixelRatio || 1);

      ctx.clearRect(0, 0, width, height);

      const o = toScreen(0, 0);

      // Axes
      ctx.strokeStyle = isLight ? '#cbd5e1' : '#232b3b';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(20, o.y); ctx.lineTo(width - 20, o.y);
      ctx.moveTo(o.x, 20); ctx.lineTo(o.x, height - 20);
      ctx.stroke();

      // Vector A from origin
      const aTip = toScreen(vecA.x, vecA.y);
      drawArrow(o, aTip, isLight ? '#0284c7' : '#38bdf8', 3);

      // Vector B starting from tip of A (Head-to-Tail)
      const bTip = toScreen(vecA.x + vecB.x, vecA.y + vecB.y);
      drawArrow(aTip, bTip, isLight ? '#16a34a' : '#4ade80', 3);

      // Resultant vector scaled
      const sumX = (vecA.x + vecB.x) * scalar;
      const sumY = (vecA.y + vecB.y) * scalar;
      const sumTip = toScreen(sumX, sumY);

      drawArrow(o, sumTip, isLight ? '#d97706' : '#fbbf24', 3.5);

      // Knobs for dragging
      ctx.fillStyle = isLight ? '#0284c7' : '#38bdf8';
      ctx.beginPath(); ctx.arc(aTip.x, aTip.y, 7, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();

      ctx.fillStyle = isLight ? '#16a34a' : '#4ade80';
      ctx.beginPath(); ctx.arc(bTip.x, bTip.y, 7, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();

      document.getElementById('vecAText').textContent = `[${vecA.x.toFixed(1)}, ${vecA.y.toFixed(1)}]`;
      document.getElementById('vecBText').textContent = `[${vecB.x.toFixed(1)}, ${vecB.y.toFixed(1)}]`;
      document.getElementById('vecSumText').textContent = `[${sumX.toFixed(1)}, ${sumY.toFixed(1)}]`;
    }

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: cx - rect.left, y: cy - rect.top };
    }

    canvas.addEventListener('mousedown', (e) => {
      const p = getPos(e);
      const aTip = toScreen(vecA.x, vecA.y);
      const bTip = toScreen(vecA.x + vecB.x, vecA.y + vecB.y);
      if (Math.hypot(p.x - aTip.x, p.y - aTip.y) < 20) dragging = 'A';
      else if (Math.hypot(p.x - bTip.x, p.y - bTip.y) < 20) dragging = 'B';
    });

    window.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      const p = getPos(e);
      const m = toMath(p.x, p.y);
      if (dragging === 'A') {
        vecA.x = Math.round(m.x * 2) / 2;
        vecA.y = Math.round(m.y * 2) / 2;
      } else if (dragging === 'B') {
        vecB.x = Math.round((m.x - vecA.x) * 2) / 2;
        vecB.y = Math.round((m.y - vecA.y) * 2) / 2;
      }
      draw();
    });

    window.addEventListener('mouseup', () => dragging = null);

    canvas.addEventListener('touchstart', (e) => {
      const p = getPos(e);
      const aTip = toScreen(vecA.x, vecA.y);
      const bTip = toScreen(vecA.x + vecB.x, vecA.y + vecB.y);
      if (Math.hypot(p.x - aTip.x, p.y - aTip.y) < 25) dragging = 'A';
      else if (Math.hypot(p.x - bTip.x, p.y - bTip.y) < 25) dragging = 'B';
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (!dragging) return;
      e.preventDefault();
      const p = getPos(e);
      const m = toMath(p.x, p.y);
      if (dragging === 'A') {
        vecA.x = Math.round(m.x * 2) / 2;
        vecA.y = Math.round(m.y * 2) / 2;
      } else if (dragging === 'B') {
        vecB.x = Math.round((m.x - vecA.x) * 2) / 2;
        vecB.y = Math.round((m.y - vecA.y) * 2) / 2;
      }
      draw();
    }, { passive: false });

    window.addEventListener('touchend', () => dragging = null);

    document.getElementById('scalarSlider').addEventListener('input', (e) => {
      scalar = parseFloat(e.target.value);
      document.getElementById('scalarLabel').textContent = `${scalar.toFixed(1)}x`;
      draw();
    });

    resize();
  </script>
</body>
</html>
