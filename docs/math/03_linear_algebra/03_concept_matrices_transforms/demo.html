<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Concept 03: Matrix Transformation Visualizer</title>
  <script src="../../../assets/theme.js"></script>
  <link rel="stylesheet" href="../../../assets/axon.css">
  <style>
    .demo-wrap {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 12px;
    }
    .canvas-container {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      position: relative;
      overflow: hidden;
      min-height: 340px;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }
    .stats-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 12px 16px;
      border-radius: 10px;
      font-family: ui-monospace, "SF Mono", monospace;
      font-size: 0.85rem;
    }
    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .stat-label {
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
    }
    .stat-val {
      font-weight: 700;
      color: var(--ink);
    }
  </style>
</head>
<body>
  <div class="demo-wrap">
    <div class="canvas-container">
      <canvas id="matrixCanvas"></canvas>
    </div>
    
    <div class="stats-row">
      <div class="stat-item">
        <span class="stat-label">î' Landing (Column 1)</span>
        <span class="stat-val" id="iHatText" style="color: var(--accent-green);">[1.0, 0.0]</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">ĵ' Landing (Column 2)</span>
        <span class="stat-val" id="jHatText" style="color: var(--accent-red);">[0.0, 1.0]</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Matrix [ A ]</span>
        <span class="stat-val" id="matText" style="color: var(--accent-amber);">[[1.0, 0.0], [0.0, 1.0]]</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Area Scale (Determinant)</span>
        <span class="stat-val" id="detText" style="color: var(--accent); font-size: 1.05rem;">1.00</span>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('matrixCanvas');
    const ctx = canvas.getContext('2d');

    let i_hat = { x: 1.0, y: 0.0 };
    let j_hat = { x: 0.0, y: 1.0 };
    let dragging = null;

    function resize() {
      const rect = canvas.parentElement.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      draw();
    }
    window.addEventListener('resize', resize);
    window.addEventListener('axon-theme-changed', draw);

    function toScreen(mx, my) {
      const cx = (canvas.width / (window.devicePixelRatio || 1)) / 2;
      const cy = (canvas.height / (window.devicePixelRatio || 1)) / 2;
      const scale = 50;
      return { x: cx + mx * scale, y: cy - my * scale };
    }

    function toMath(sx, sy) {
      const cx = (canvas.width / (window.devicePixelRatio || 1)) / 2;
      const cy = (canvas.height / (window.devicePixelRatio || 1)) / 2;
      const scale = 50;
      return {
        x: (sx - cx) / scale,
        y: -(sy - cy) / scale
      };
    }

    function drawArrow(from, to, color, width = 3) {
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = width;
      ctx.beginPath();
      ctx.moveTo(from.x, from.y);
      ctx.lineTo(to.x, to.y);
      ctx.stroke();

      const angle = Math.atan2(to.y - from.y, to.x - from.x);
      const head = 8;
      ctx.beginPath();
      ctx.moveTo(to.x, to.y);
      ctx.lineTo(to.x - head * Math.cos(angle - Math.PI / 6), to.y - head * Math.sin(angle - Math.PI / 6));
      ctx.lineTo(to.x - head * Math.cos(angle + Math.PI / 6), to.y - head * Math.sin(angle + Math.PI / 6));
      ctx.closePath();
      ctx.fill();
    }

    function draw() {
      const isLight = document.documentElement.getAttribute('data-theme') === 'light';
      const width = canvas.width / (window.devicePixelRatio || 1);
      const height = canvas.height / (window.devicePixelRatio || 1);

      ctx.clearRect(0, 0, width, height);

      const o = toScreen(0, 0);

      // Transformed grid lines
      const maxGrid = 4;
      ctx.strokeStyle = isLight ? 'rgba(2, 132, 199, 0.15)' : 'rgba(56, 189, 248, 0.12)';
      ctx.lineWidth = 1;
      for (let i = -maxGrid; i <= maxGrid; i++) {
        const startX = i * i_hat.x + (-maxGrid) * j_hat.x;
        const startY = i * i_hat.y + (-maxGrid) * j_hat.y;
        const endX = i * i_hat.x + (maxGrid) * j_hat.x;
        const endY = i * i_hat.y + (maxGrid) * j_hat.y;
        const p1 = toScreen(startX, startY);
        const p2 = toScreen(endX, endY);
        ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();

        const sX2 = (-maxGrid) * i_hat.x + i * j_hat.x;
        const sY2 = (-maxGrid) * i_hat.y + i * j_hat.y;
        const eX2 = (maxGrid) * i_hat.x + i * j_hat.x;
        const eY2 = (maxGrid) * i_hat.y + i * j_hat.y;
        const p3 = toScreen(sX2, sY2);
        const p4 = toScreen(eX2, eY2);
        ctx.beginPath(); ctx.moveTo(p3.x, p3.y); ctx.lineTo(p4.x, p4.y); ctx.stroke();
      }

      // Shaded Unit Square
      const pO = toScreen(0, 0);
      const pI = toScreen(i_hat.x, i_hat.y);
      const pJ = toScreen(j_hat.x, j_hat.y);
      const pSum = toScreen(i_hat.x + j_hat.x, i_hat.y + j_hat.y);

      ctx.fillStyle = isLight ? 'rgba(22, 163, 74, 0.2)' : 'rgba(74, 222, 128, 0.15)';
      ctx.beginPath();
      ctx.moveTo(pO.x, pO.y); ctx.lineTo(pI.x, pI.y); ctx.lineTo(pSum.x, pSum.y); ctx.lineTo(pJ.x, pJ.y);
      ctx.closePath();
      ctx.fill();

      // Axes
      ctx.strokeStyle = isLight ? '#cbd5e1' : '#232b3b';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(20, o.y); ctx.lineTo(width - 20, o.y);
      ctx.moveTo(o.x, 20); ctx.lineTo(o.x, height - 20);
      ctx.stroke();

      // Arrows
      drawArrow(o, pI, isLight ? '#16a34a' : '#4ade80', 3.5);
      drawArrow(o, pJ, isLight ? '#e11d48' : '#f43f5e', 3.5);

      // Knobs
      ctx.fillStyle = isLight ? '#16a34a' : '#4ade80';
      ctx.beginPath(); ctx.arc(pI.x, pI.y, 7, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();

      ctx.fillStyle = isLight ? '#e11d48' : '#f43f5e';
      ctx.beginPath(); ctx.arc(pJ.x, pJ.y, 7, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();

      // Telemetry
      const det = i_hat.x * j_hat.y - i_hat.y * j_hat.x;
      document.getElementById('iHatText').textContent = `[${i_hat.x.toFixed(1)}, ${i_hat.y.toFixed(1)}]`;
      document.getElementById('jHatText').textContent = `[${j_hat.x.toFixed(1)}, ${j_hat.y.toFixed(1)}]`;
      document.getElementById('matText').textContent = `[[${i_hat.x.toFixed(1)}, ${j_hat.x.toFixed(1)}], [${i_hat.y.toFixed(1)}, ${j_hat.y.toFixed(1)}]]`;
      document.getElementById('detText').textContent = `${det >= 0 ? '+' : ''}${det.toFixed(2)}`;
    }

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: cx - rect.left, y: cy - rect.top };
    }

    canvas.addEventListener('mousedown', (e) => {
      const p = getPos(e);
      const pI = toScreen(i_hat.x, i_hat.y);
      const pJ = toScreen(j_hat.x, j_hat.y);
      if (Math.hypot(p.x - pI.x, p.y - pI.y) < 20) dragging = 'I';
      else if (Math.hypot(p.x - pJ.x, p.y - pJ.y) < 20) dragging = 'J';
    });

    window.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      const p = getPos(e);
      const m = toMath(p.x, p.y);
      if (dragging === 'I') { i_hat.x = Math.round(m.x * 2) / 2; i_hat.y = Math.round(m.y * 2) / 2; }
      if (dragging === 'J') { j_hat.x = Math.round(m.x * 2) / 2; j_hat.y = Math.round(m.y * 2) / 2; }
      draw();
    });

    window.addEventListener('mouseup', () => dragging = null);

    canvas.addEventListener('touchstart', (e) => {
      const p = getPos(e);
      const pI = toScreen(i_hat.x, i_hat.y);
      const pJ = toScreen(j_hat.x, j_hat.y);
      if (Math.hypot(p.x - pI.x, p.y - pI.y) < 25) dragging = 'I';
      else if (Math.hypot(p.x - pJ.x, p.y - pJ.y) < 25) dragging = 'J';
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (!dragging) return;
      e.preventDefault();
      const p = getPos(e);
      const m = toMath(p.x, p.y);
      if (dragging === 'I') { i_hat.x = Math.round(m.x * 2) / 2; i_hat.y = Math.round(m.y * 2) / 2; }
      if (dragging === 'J') { j_hat.x = Math.round(m.x * 2) / 2; j_hat.y = Math.round(m.y * 2) / 2; }
      draw();
    }, { passive: false });

    window.addEventListener('touchend', () => dragging = null);

    resize();
  </script>
</body>
</html>
