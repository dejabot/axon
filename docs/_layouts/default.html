<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  {% if page.description or site.description %}<meta name="description" content="{{ page.description | default: site.description }}">{% endif %}
  <!-- Default to dark; honor a saved choice. Runs before paint so there's no flash. -->
  <script>
    (function () {
      try { var t = localStorage.getItem('axon-theme') || localStorage.getItem('axon_theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch between light and dark">☾</button>
  </header>

  <main class="page markdown-body">
    {{ content }}
  </main>

  <footer class="site-footer">
    Axon Curriculum · <a href="{{ '/' | relative_url }}">Home</a>
  </footer>

  <!-- Syntax Highlighting (PrismJS client-side enhancement for raw/dynamic blocks) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-java.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>

  <!-- Simple light/dark toggle, remembered across the whole site (pages + demos). -->
  <script>
    (function () {
      var root = document.documentElement, btn = document.getElementById('themeToggle');
      function cur() { return root.getAttribute('data-theme') === 'light' ? 'light' : 'dark'; }
      function paint() {
        if (btn) {
          btn.textContent = cur() === 'dark' ? '☾' : '☀';
          btn.title = cur() === 'dark' ? 'Dark theme — switch to light' : 'Light theme — switch to dark';
        }
      }
      paint();
      if (btn) {
        btn.addEventListener('click', function () {
          var next = cur() === 'dark' ? 'light' : 'dark';
          root.setAttribute('data-theme', next);
          try {
            localStorage.setItem('axon-theme', next);
            localStorage.setItem('axon_theme', next);
          } catch (e) {}
          paint();
        });
      }
    })();
  </script>
</body>
</html>
