<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Concept 01: Loss Functions (MSE & MAE)</title>
  <link rel="stylesheet" href="../../../assets/axon.css">
  <script src="../../../assets/theme.js"></script>
</head>
<body class="demo-embed">
  <div class="demo-container">
    <div class="demo-header">
      <div class="demo-title">Shooter Calibration: MSE vs. MAE Loss Visualizer</div>
      <div class="demo-badge">Concept 01 Demo</div>
    </div>

    <div class="canvas-wrapper">
      <canvas id="lossCanvas" width="800" height="420"></canvas>
    </div>

    <div class="controls-panel">
      <div class="control-group">
        <label>Model Slope (w): <span id="wLabel" class="value-display">1.20</span></label>
        <input type="range" id="wSlider" min="0.2" max="2.5" step="0.05" value="1.20">
      </div>
      <div class="control-group">
        <label>Model Intercept (b): <span id="bLabel" class="value-display">0.50</span></label>
        <input type="range" id="bSlider" min="-1.5" max="2.5" step="0.1" value="0.50">
      </div>
      <div class="control-group">
        <button class="btn btn-secondary" id="bestFitBtn">Auto-Fit Optimal Weights</button>
      </div>
    </div>

    <div class="telemetry-grid">
      <div class="telemetry-card">
        <div class="telemetry-label">Mean Squared Error (MSE)</div>
        <div class="telemetry-value" id="mseText" style="color: #f43f5e;">--</div>
      </div>
      <div class="telemetry-card">
        <div class="telemetry-label">Mean Absolute Error (MAE)</div>
        <div class="telemetry-value" id="maeText" style="color: #fbbf24;">--</div>
      </div>
      <div class="telemetry-card">
        <div class="telemetry-label">Worst Single Miss (Max Error)</div>
        <div class="telemetry-value" id="maxErrText">--</div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const canvas = document.getElementById('lossCanvas');
      const ctx = canvas.getContext('2d');

      // Sample data points: (Target Distance x in meters, True Flywheel RPM / Shot distance y in meters)
      const dataPoints = [
        { x: 1.5, y: 2.2 },
        { x: 2.2, y: 3.1 },
        { x: 3.0, y: 4.2 },
        { x: 3.8, y: 4.9 },
        { x: 4.5, y: 6.1 },
        { x: 5.2, y: 6.8 }
      ];

      let w = 1.20;
      let b = 0.50;

      function render() {
        const isDark = document.documentElement.getAttribute('data-theme') !== 'light';
        const textColor = isDark ? '#f1f5f9' : '#0f172a';
        const mutedColor = isDark ? '#64748b' : '#94a3b8';
        const gridColor = isDark ? '#1e293b' : '#e2e8f0';

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Split canvas into two panes:
        // Left pane (x: 20 to 450): Data scatter and prediction line
        // Right pane (x: 480 to 780): MSE loss parabolic curve
        const leftW = 430;
        const leftH = 340;
        const originX = 50;
        const originY = 360;

        // Draw Left Pane Grid
        ctx.strokeStyle = gridColor;
        ctx.lineWidth = 1;
        for (let i = 0; i <= 6; i++) {
          const px = originX + (i / 6) * (leftW - 30);
          ctx.beginPath();
          ctx.moveTo(px, 30);
          ctx.lineTo(px, originY);
          ctx.stroke();

          ctx.fillStyle = mutedColor;
          ctx.font = '11px sans-serif';
          ctx.fillText(i + 'm', px - 8, originY + 16);
        }
        for (let j = 0; j <= 8; j += 2) {
          const py = originY - (j / 8) * (originY - 40);
          ctx.beginPath();
          ctx.moveTo(originX, py);
          ctx.lineTo(originX + leftW - 30, py);
          ctx.stroke();

          ctx.fillStyle = mutedColor;
          ctx.font = '11px sans-serif';
          ctx.fillText(j + 'm', originX - 30, py + 4);
        }

        // Left Pane Title
        ctx.fillStyle = textColor;
        ctx.font = 'bold 13px sans-serif';
        ctx.fillText('Target Distance vs. Model Shot', originX, 22);

        // Convert data coords to screen pixels
        function toScreen(x, y) {
          const sx = originX + (x / 6) * (leftW - 30);
          const sy = originY - (y / 8) * (originY - 40);
          return { sx, sy };
        }

        // Compute errors
        let totalSqErr = 0;
        let totalAbsErr = 0;
        let maxErr = 0;

        dataPoints.forEach(p => {
          const predY = w * p.x + b;
          const err = predY - p.y;
          totalSqErr += err * err;
          totalAbsErr += Math.abs(err);
          if (Math.abs(err) > maxErr) maxErr = Math.abs(err);
        });

        const mse = totalSqErr / dataPoints.length;
        const mae = totalAbsErr / dataPoints.length;

        // Draw Prediction Line y = w*x + b
        const pStart = toScreen(0, b);
        const pEnd = toScreen(6, w * 6 + b);

        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(pStart.sx, pStart.sy);
        ctx.lineTo(pEnd.sx, pEnd.sy);
        ctx.stroke();

        // Draw Residual Error Lines from points to line
        dataPoints.forEach(p => {
          const predY = w * p.x + b;
          const pScreen = toScreen(p.x, p.y);
          const predScreen = toScreen(p.x, predY);

          // Residual vertical line
          ctx.strokeStyle = '#f43f5e';
          ctx.lineWidth = 2;
          ctx.setLineDash([4, 4]);
          ctx.beginPath();
          ctx.moveTo(pScreen.sx, pScreen.sy);
          ctx.lineTo(predScreen.sx, predScreen.sy);
          ctx.stroke();
          ctx.setLineDash([]);

          // Data Point
          ctx.fillStyle = '#4ade80';
          ctx.beginPath();
          ctx.arc(pScreen.sx, pScreen.sy, 6, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#0f172a';
          ctx.lineWidth = 1.5;
          ctx.stroke();
        });

        // ---------------- Right Pane: Loss Parabolic Curve ----------------
        const rightX = 490;
        const rightY = 360;
        const rightW = 280;
        const rightH = 320;

        ctx.fillStyle = textColor;
        ctx.font = 'bold 13px sans-serif';
        ctx.fillText('MSE Loss Landscape vs. Slope (w)', rightX, 22);

        // Draw Loss Axis
        ctx.strokeStyle = gridColor;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(rightX, rightY);
        ctx.lineTo(rightX + rightW, rightY);
        ctx.moveTo(rightX, rightY);
        ctx.lineTo(rightX, 40);
        ctx.stroke();

        // Plot Loss curve for w in [0.2, 2.5]
        ctx.strokeStyle = '#f43f5e';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        let first = true;
        for (let testW = 0.2; testW <= 2.5; testW += 0.05) {
          let testSqErr = 0;
          dataPoints.forEach(p => {
            const pred = testW * p.x + b;
            testSqErr += (pred - p.y) ** 2;
          });
          const testMSE = testSqErr / dataPoints.length;

          const cx = rightX + ((testW - 0.2) / (2.5 - 0.2)) * rightW;
          const cy = rightY - Math.min(testMSE / 5.0, 1.0) * (rightY - 60);

          if (first) {
            ctx.moveTo(cx, cy);
            first = false;
          } else {
            ctx.lineTo(cx, cy);
          }
        }
        ctx.stroke();

        // Current position ball on the loss curve
        const curLossX = rightX + ((w - 0.2) / (2.5 - 0.2)) * rightW;
        const curLossY = rightY - Math.min(mse / 5.0, 1.0) * (rightY - 60);

        ctx.fillStyle = '#fbbf24';
        ctx.beginPath();
        ctx.arc(curLossX, curLossY, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#f43f5e';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Update telemetry
        document.getElementById('wLabel').textContent = w.toFixed(2);
        document.getElementById('bLabel').textContent = b.toFixed(2);
        document.getElementById('mseText').textContent = mse.toFixed(4) + ' m²';
        document.getElementById('maeText').textContent = mae.toFixed(4) + ' m';
        document.getElementById('maxErrText').textContent = '±' + maxErr.toFixed(3) + ' m';
      }

      document.getElementById('wSlider').addEventListener('input', (e) => {
        w = parseFloat(e.target.value);
        render();
      });

      document.getElementById('bSlider').addEventListener('input', (e) => {
        b = parseFloat(e.target.value);
        render();
      });

      document.getElementById('bestFitBtn').addEventListener('click', () => {
        // Optimal slope and intercept for this dataset
        w = 1.26;
        b = 0.35;
        document.getElementById('wSlider').value = w;
        document.getElementById('bSlider').value = b;
        render();
      });

      render();
    })();
  </script>
</body>
</html>
