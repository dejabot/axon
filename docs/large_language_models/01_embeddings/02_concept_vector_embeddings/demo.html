<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Concept 02: High-Dimensional Semantic Vector Space</title>
  <link rel="stylesheet" href="../../../assets/axon.css">
  <script src="../../../assets/theme.js"></script>
</head>
<body class="demo-embed">
  <div class="demo-container">
    <div class="demo-header">
      <div class="demo-title">2D Semantic Embedding Space & Cosine Similarity</div>
      <div class="demo-badge">Concept 02 Demo</div>
    </div>

    <div class="canvas-wrapper">
      <canvas id="embedCanvas" width="800" height="420"></canvas>
    </div>

    <div class="controls-panel">
      <div class="control-group">
        <label>Selected Vector A: <span id="vecALabel" class="value-display">Note</span></label>
      </div>
      <div class="control-group">
        <label>Selected Vector B: <span id="vecBLabel" class="value-display">Coral</span></label>
      </div>
      <div class="control-group">
        <button class="btn btn-secondary" id="compareHardwareBtn">Compare Note vs. Battery</button>
      </div>
    </div>

    <div class="telemetry-grid">
      <div class="telemetry-card">
        <div class="telemetry-label">Cosine Similarity cos(θ)</div>
        <div class="telemetry-value" id="simText" style="color: #4ade80;">+0.996</div>
      </div>
      <div class="telemetry-card">
        <div class="telemetry-label">Angle Between Vectors (θ)</div>
        <div class="telemetry-value" id="angleText" style="color: #38bdf8;">5.1°</div>
      </div>
      <div class="telemetry-card">
        <div class="telemetry-label">Semantic Relationship</div>
        <div class="telemetry-value" id="relationText" style="color: #4ade80;">Highly Synonymous</div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const canvas = document.getElementById('embedCanvas');
      const ctx = canvas.getContext('2d');

      const wordVectors = [
        // Scoring Cluster (Orange)
        { name: "Note", x: 1.6, y: 2.8, color: "#fb923c" },
        { name: "Coral", x: 1.9, y: 3.1, color: "#fb923c" },
        { name: "Algae", x: 1.2, y: 2.3, color: "#fb923c" },
        { name: "Reef", x: 2.2, y: 2.7, color: "#fb923c" },

        // Hardware Cluster (Cyan)
        { name: "Motor", x: -2.4, y: 1.8, color: "#38bdf8" },
        { name: "Swerve", x: -3.0, y: 2.1, color: "#38bdf8" },
        { name: "Gearbox", x: -2.7, y: 1.2, color: "#38bdf8" },
        { name: "Battery", x: -3.2, y: 0.5, color: "#38bdf8" },

        // Control Cluster (Green)
        { name: "PID", x: -1.2, y: -2.6, color: "#4ade80" },
        { name: "Odometry", x: -1.8, y: -2.9, color: "#4ade80" },
        { name: "Kalman", x: -2.2, y: -2.3, color: "#4ade80" },
        { name: "Autograd", x: -0.8, y: -3.1, color: "#4ade80" }
      ];

      let selectedA = wordVectors[0]; // Note
      let selectedB = wordVectors[1]; // Coral

      function toScreen(x, y) {
        // x from -4.0 to 4.0 -> screen x: 60 to 740
        // y from -4.0 to 4.0 -> screen y: 380 to 40
        const sx = canvas.width / 2 + (x / 4.0) * (canvas.width / 2 - 60);
        const sy = canvas.height / 2 - (y / 4.0) * (canvas.height / 2 - 40);
        return { sx, sy };
      }

      function fromScreen(sx, sy) {
        const x = ((sx - canvas.width / 2) / (canvas.width / 2 - 60)) * 4.0;
        const y = -((sy - canvas.height / 2) / (canvas.height / 2 - 40)) * 4.0;
        return { x, y };
      }

      function render() {
        const isDark = document.documentElement.getAttribute('data-theme') !== 'light';
        const textColor = isDark ? '#f1f5f9' : '#0f172a';
        const mutedColor = isDark ? '#64748b' : '#94a3b8';
        const gridColor = isDark ? '#1e293b' : '#e2e8f0';

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw Axes & Center
        ctx.strokeStyle = gridColor;
        ctx.lineWidth = 1;
        const center = toScreen(0, 0);

        ctx.beginPath();
        ctx.moveTo(40, center.sy);
        ctx.lineTo(canvas.width - 40, center.sy);
        ctx.moveTo(center.sx, 20);
        ctx.lineTo(center.sx, canvas.height - 20);
        ctx.stroke();

        // Origin label
        ctx.fillStyle = mutedColor;
        ctx.font = '11px sans-serif';
        ctx.fillText('(0, 0)', center.sx + 6, center.sy + 14);

        // Draw Selected Vector Rays
        if (selectedA && selectedB) {
          const ptA = toScreen(selectedA.x, selectedA.y);
          const ptB = toScreen(selectedB.x, selectedB.y);

          // Ray A
          ctx.strokeStyle = '#fbbf24';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.moveTo(center.sx, center.sy);
          ctx.lineTo(ptA.sx, ptA.sy);
          ctx.stroke();

          // Ray B
          ctx.strokeStyle = '#c084fc';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.moveTo(center.sx, center.sy);
          ctx.lineTo(ptB.sx, ptB.sy);
          ctx.stroke();

          // Angle arc
          const angleA = Math.atan2(-selectedA.y, selectedA.x);
          const angleB = Math.atan2(-selectedB.y, selectedB.x);
          ctx.strokeStyle = '#f43f5e';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(center.sx, center.sy, 35, angleA, angleB, false);
          ctx.stroke();
        }

        // Draw all word embedding nodes
        wordVectors.forEach(v => {
          const pt = toScreen(v.x, v.y);
          const isA = (v === selectedA);
          const isB = (v === selectedB);

          ctx.fillStyle = v.color;
          ctx.beginPath();
          ctx.arc(pt.sx, pt.sy, (isA || isB) ? 9 : 6, 0, Math.PI * 2);
          ctx.fill();

          if (isA || isB) {
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2.5;
            ctx.stroke();
          }

          ctx.fillStyle = (isA || isB) ? textColor : mutedColor;
          ctx.font = (isA || isB) ? 'bold 13px sans-serif' : '11px sans-serif';
          ctx.fillText(v.name, pt.sx + 10, pt.sy + 4);
        });

        // Calculate Cosine Similarity
        if (selectedA && selectedB) {
          const dot = selectedA.x * selectedB.x + selectedA.y * selectedB.y;
          const magA = Math.hypot(selectedA.x, selectedA.y);
          const magB = Math.hypot(selectedB.x, selectedB.y);
          const cosSim = dot / (magA * magB);
          const angleDeg = Math.toDegrees ? Math.toDegrees(Math.acos(Math.max(-1, Math.min(1, cosSim)))) : (Math.acos(Math.max(-1, Math.min(1, cosSim))) * 180 / Math.PI);

          document.getElementById('vecALabel').textContent = selectedA.name;
          document.getElementById('vecBLabel').textContent = selectedB.name;

          document.getElementById('simText').textContent = (cosSim >= 0 ? '+' : '') + cosSim.toFixed(3);
          document.getElementById('angleText').textContent = `${angleDeg.toFixed(1)}°`;

          const relEl = document.getElementById('relationText');
          if (cosSim >= 0.85) {
            relEl.textContent = 'Highly Synonymous / Related';
            relEl.style.color = '#4ade80';
          } else if (cosSim >= 0.20) {
            relEl.textContent = 'Moderate Semantic Distance';
            relEl.style.color = '#fbbf24';
          } else {
            relEl.textContent = 'Orthogonal / Unrelated Concept';
            relEl.style.color = '#f43f5e';
          }
        }
      }

      canvas.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;

        // Find closest word node
        let closest = null;
        let minDist = 30;
        wordVectors.forEach(v => {
          const pt = toScreen(v.x, v.y);
          const d = Math.hypot(mx - pt.sx, my - pt.sy);
          if (d < minDist) {
            minDist = d;
            closest = v;
          }
        });

        if (closest) {
          if (closest !== selectedA) {
            selectedB = selectedA;
            selectedA = closest;
          }
          render();
        }
      });

      document.getElementById('compareHardwareBtn').addEventListener('click', () => {
        selectedA = wordVectors.find(w => w.name === "Note");
        selectedB = wordVectors.find(w => w.name === "Battery");
        render();
      });

      render();
    })();
  </script>
</body>
</html>
