<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Concept 01: Rotary Position Embeddings (RoPE) Visualizer</title>
  <link rel="stylesheet" href="../../../assets/axon.css">
  <script src="../../../assets/theme.js"></script>
</head>
<body class="demo-embed">
  <div class="demo-container">
    <div class="demo-header">
      <div class="demo-title">Rotary Position Embeddings (RoPE) in 2D Space</div>
      <div class="demo-badge">Concept 01 Demo</div>
    </div>

    <div class="controls-panel">
      <div class="control-group">
        <label>Token A Position (m): <span id="posMDisplay" class="value-display">2</span></label>
        <input type="range" id="posMSlider" min="0" max="16" step="1" value="2">
      </div>
      <div class="control-group">
        <label>Token B Position (n): <span id="posNDisplay" class="value-display">5</span></label>
        <input type="range" id="posNSlider" min="0" max="16" step="1" value="5">
      </div>
      <div class="control-group">
        <button class="btn btn-secondary" id="shiftBothBtn">Shift Both (+4)</button>
      </div>
    </div>

    <div class="canvas-wrapper">
      <canvas id="ropeCanvas" width="800" height="420"></canvas>
    </div>

    <div class="telemetry-grid">
      <div class="telemetry-card">
        <div class="telemetry-label">Relative Distance (m - n)</div>
        <div class="telemetry-value" id="relDistText" style="color: #38bdf8;">-3 positions</div>
      </div>
      <div class="telemetry-card">
        <div class="telemetry-label">Relative Angle Difference Δθ</div>
        <div class="telemetry-value" id="angleDiffText" style="color: #4ade80;">-54.0°</div>
      </div>
      <div class="telemetry-card">
        <div class="telemetry-label">Relative Dot Product Score</div>
        <div class="telemetry-value" id="dotScoreText" style="color: #fbbf24;">+0.588 (Invariant)</div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const canvas = document.getElementById('ropeCanvas');
      const ctx = canvas.getContext('2d');

      const theta = 0.314159; // ~18 degrees per step

      function render() {
        const isDark = document.documentElement.getAttribute('data-theme') !== 'light';
        const textColor = isDark ? '#f1f5f9' : '#0f172a';
        const mutedColor = isDark ? '#64748b' : '#94a3b8';
        const gridColor = isDark ? '#1e293b' : '#e2e8f0';

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        let m = parseInt(document.getElementById('posMSlider').value);
        let n = parseInt(document.getElementById('posNSlider').value);

        document.getElementById('posMDisplay').textContent = m;
        document.getElementById('posNDisplay').textContent = n;

        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const radius = 140;

        // Draw Unit Circle
        ctx.strokeStyle = gridColor;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
        ctx.stroke();

        // Draw Axes
        ctx.beginPath();
        ctx.moveTo(centerX - radius - 30, centerY);
        ctx.lineTo(centerX + radius + 30, centerY);
        ctx.moveTo(centerX, centerY - radius - 30);
        ctx.lineTo(centerX, centerY + radius + 30);
        ctx.stroke();

        // Base Vector Q at (1.0, 0.0) -> rotated by m * theta
        const angleM = m * theta;
        const angleN = n * theta;

        const ax = centerX + radius * Math.cos(angleM);
        const ay = centerY - radius * Math.sin(angleM);

        const bx = centerX + radius * Math.cos(angleN);
        const by = centerY - radius * Math.sin(angleN);

        // Vector A (Token m) in Gold
        ctx.strokeStyle = '#fbbf24';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(ax, ay);
        ctx.stroke();

        ctx.fillStyle = '#fbbf24';
        ctx.beginPath();
        ctx.arc(ax, ay, 6, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = textColor;
        ctx.font = 'bold 12px sans-serif';
        ctx.fillText(`Token A (pos ${m})`, ax + 10, ay);

        // Vector B (Token n) in Purple
        ctx.strokeStyle = '#c084fc';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(bx, by);
        ctx.stroke();

        ctx.fillStyle = '#c084fc';
        ctx.beginPath();
        ctx.arc(bx, by, 6, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = textColor;
        ctx.fillText(`Token B (pos ${n})`, bx + 10, by);

        // Relative Arc
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(centerX, centerY, 50, -angleM, -angleN, angleM > angleN);
        ctx.stroke();

        // Telemetry Update
        const relDist = m - n;
        const deltaAngleDeg = (relDist * theta * 180 / Math.PI);
        const dotProd = Math.cos(relDist * theta);

        document.getElementById('relDistText').textContent = `${relDist > 0 ? '+' : ''}${relDist} tokens`;
        document.getElementById('angleDiffText').textContent = `${deltaAngleDeg.toFixed(1)}°`;
        document.getElementById('dotScoreText').textContent = `${(dotProd >= 0 ? '+' : '')}${dotProd.toFixed(3)} (Invariant)`;
      }

      document.getElementById('posMSlider').addEventListener('input', render);
      document.getElementById('posNSlider').addEventListener('input', render);

      document.getElementById('shiftBothBtn').addEventListener('click', () => {
        let m = parseInt(document.getElementById('posMSlider').value);
        let n = parseInt(document.getElementById('posNSlider').value);
        if (m + 4 <= 16 && n + 4 <= 16) {
          document.getElementById('posMSlider').value = m + 4;
          document.getElementById('posNSlider').value = n + 4;
        } else {
          document.getElementById('posMSlider').value = (m + 4) % 16;
          document.getElementById('posNSlider').value = (n + 4) % 16;
        }
        render();
      });

      render();
    })();
  </script>
</body>
</html>
