<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Concept 02: Transformer Decoder Block Inspector</title>
  <link rel="stylesheet" href="../../../assets/axon.css">
  <script src="../../../assets/theme.js"></script>
</head>
<body class="demo-embed">
  <div class="demo-container">
    <div class="demo-header">
      <div class="demo-title">Transformer Decoder Block Architecture & Tensor Flow</div>
      <div class="demo-badge">Concept 02 Demo</div>
    </div>

    <div class="controls-panel">
      <button class="btn btn-primary" id="btnInput">1. Input Stream</button>
      <button class="btn btn-secondary" id="btnMHA">2. Multi-Head Attention</button>
      <button class="btn btn-secondary" id="btnNorm">3. Pre-RMSNorm</button>
      <button class="btn btn-secondary" id="btnSwiGLU">4. SwiGLU MLP Block</button>
      <button class="btn btn-secondary" id="btnOutput">5. Output Stream</button>
    </div>

    <div class="canvas-wrapper">
      <canvas id="blockCanvas" width="800" height="420"></canvas>
    </div>

    <div class="telemetry-grid">
      <div class="telemetry-card">
        <div class="telemetry-label">Active Component</div>
        <div class="telemetry-value" id="compLabel" style="color: #38bdf8;">Multi-Head Self-Attention</div>
      </div>
      <div class="telemetry-card">
        <div class="telemetry-label">Tensor Dimension Shape</div>
        <div class="telemetry-value" id="shapeLabel" style="color: #4ade80;">(Batch, SeqLen=9, Dim=768)</div>
      </div>
      <div class="telemetry-card">
        <div class="telemetry-label">Mathematical Role</div>
        <div class="telemetry-value" id="roleLabel" style="color: #fbbf24;">Dynamic Context Mixing between Tokens</div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const canvas = document.getElementById('blockCanvas');
      const ctx = canvas.getContext('2d');

      const stages = [
        {
          id: "btnInput",
          name: "Input Residual Stream",
          shape: "(Batch, SeqLen=9, Dim=768)",
          role: "Token Embeddings + Position Encodings",
          color: "#38bdf8",
          box: { x: 300, y: 360, w: 200, h: 36 }
        },
        {
          id: "btnNorm",
          name: "Pre-RMSNorm Normalization",
          shape: "(Batch, SeqLen=9, Dim=768)",
          role: "Root Mean Square Scaling with Learnable Gamma",
          color: "#c084fc",
          box: { x: 300, y: 280, w: 200, h: 36 }
        },
        {
          id: "btnMHA",
          name: "Multi-Head Self-Attention",
          shape: "(Batch, SeqLen=9, Dim=768)",
          role: "Dynamic Context Mixing between Tokens (Q, K, V)",
          color: "#4ade80",
          box: { x: 300, y: 200, w: 200, h: 44 }
        },
        {
          id: "btnSwiGLU",
          name: "SwiGLU Feed-Forward Network",
          shape: "Expanded: (Batch, SeqLen=9, Dim=3072)",
          role: "Associative Memory & Knowledge Retrieval (Gated MLP)",
          color: "#fb923c",
          box: { x: 300, y: 100, w: 200, h: 54 }
        },
        {
          id: "btnOutput",
          name: "Block Output Residual Stream",
          shape: "(Batch, SeqLen=9, Dim=768)",
          role: "Refined Token Representations ready for next block",
          color: "#38bdf8",
          box: { x: 300, y: 20, w: 200, h: 36 }
        }
      ];

      let activeStage = stages[2]; // MHA

      function render() {
        const isDark = document.documentElement.getAttribute('data-theme') !== 'light';
        const textColor = isDark ? '#f1f5f9' : '#0f172a';
        const mutedColor = isDark ? '#64748b' : '#94a3b8';

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw Central Trunk Flow Lines
        ctx.strokeStyle = isDark ? '#334155' : '#cbd5e1';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(400, 380);
        ctx.lineTo(400, 30);
        ctx.stroke();

        // Draw Residual Skip Bypass 1 (MHA bypass)
        ctx.strokeStyle = '#4ade80';
        ctx.lineWidth = 2.5;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(400, 330);
        ctx.lineTo(550, 330);
        ctx.lineTo(550, 180);
        ctx.lineTo(400, 180);
        ctx.stroke();

        // Draw Residual Skip Bypass 2 (SwiGLU bypass)
        ctx.strokeStyle = '#fb923c';
        ctx.beginPath();
        ctx.moveTo(400, 170);
        ctx.lineTo(240, 170);
        ctx.lineTo(240, 80);
        ctx.lineTo(400, 80);
        ctx.stroke();
        ctx.setLineDash([]);

        // Labels for Skip Connections
        ctx.fillStyle = '#4ade80';
        ctx.font = '10px sans-serif';
        ctx.fillText('+ Residual Skip 1', 555, 255);

        ctx.fillStyle = '#fb923c';
        ctx.textAlign = 'right';
        ctx.fillText('+ Residual Skip 2', 235, 125);
        ctx.textAlign = 'left';

        // Draw Component Blocks
        stages.forEach(st => {
          const isAct = (st === activeStage);
          const b = st.box;

          ctx.fillStyle = isAct ? `rgba(56, 189, 248, 0.2)` : (isDark ? '#141923' : '#f8fafc');
          ctx.fillRect(b.x, b.y, b.w, b.h);

          ctx.strokeStyle = isAct ? st.color : (isDark ? '#334155' : '#cbd5e1');
          ctx.lineWidth = isAct ? 2.5 : 1.5;
          ctx.strokeRect(b.x, b.y, b.w, b.h);

          // Name Text
          ctx.fillStyle = isAct ? st.color : textColor;
          ctx.font = isAct ? 'bold 12px sans-serif' : '11px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(st.name, b.x + b.w / 2, b.y + b.h / 2 + 4);
        });

        // Telemetry Update
        document.getElementById('compLabel').textContent = activeStage.name;
        document.getElementById('compLabel').style.color = activeStage.color;
        document.getElementById('shapeLabel').textContent = activeStage.shape;
        document.getElementById('roleLabel').textContent = activeStage.role;
      }

      stages.forEach(st => {
        document.getElementById(st.id).addEventListener('click', () => {
          activeStage = st;
          stages.forEach(other => {
            const btn = document.getElementById(other.id);
            btn.className = (other === st) ? 'btn btn-primary' : 'btn btn-secondary';
          });
          render();
        });
      });

      canvas.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;

        stages.forEach(st => {
          const b = st.box;
          if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) {
            activeStage = st;
            stages.forEach(other => {
              const btn = document.getElementById(other.id);
              btn.className = (other === st) ? 'btn btn-primary' : 'btn btn-secondary';
            });
            render();
          }
        });
      });

      render();
    })();
  </script>
</body>
</html>
