<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Concept 01: Scaled Dot-Product Attention Heatmap</title>
  <link rel="stylesheet" href="../../../assets/axon.css">
  <script src="../../../assets/theme.js"></script>
</head>
<body class="demo-embed">
  <div class="demo-container">
    <div class="demo-header">
      <div class="demo-title">Self-Attention Weight Heatmap & Q·K Routing</div>
      <div class="demo-badge">Concept 01 Demo</div>
    </div>

    <div class="controls-panel">
      <div class="control-group">
        <label>Selected Query Token: <span id="queryLabel" class="value-display">"it" (Index 6)</span></label>
      </div>
      <div class="control-group">
        <label>Scaling Factor √(d_k): <span id="scaleDisplay" class="value-display">8.0</span></label>
        <input type="range" id="scaleSlider" min="1.0" max="20.0" step="0.5" value="8.0">
      </div>
      <div class="control-group">
        <button class="btn btn-secondary" id="selectItBtn">Select "it"</button>
        <button class="btn btn-secondary" id="selectScoredBtn">Select "scored"</button>
      </div>
    </div>

    <div class="canvas-wrapper">
      <canvas id="attentionCanvas" width="800" height="420"></canvas>
    </div>

    <div class="telemetry-grid">
      <div class="telemetry-card">
        <div class="telemetry-label">Primary Attended Token</div>
        <div class="telemetry-value" id="topTokenText" style="color: #38bdf8;">"Note"</div>
      </div>
      <div class="telemetry-card">
        <div class="telemetry-label">Top Attention Weight</div>
        <div class="telemetry-value" id="topWeightText" style="color: #4ade80;">74.2%</div>
      </div>
      <div class="telemetry-card">
        <div class="telemetry-label">Attention Entropy / Focus</div>
        <div class="telemetry-value" id="focusText" style="color: #fbbf24;">Sharp Coreference</div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const canvas = document.getElementById('attentionCanvas');
      const ctx = canvas.getContext('2d');

      const tokens = ["The", "robot", "scored", "the", "Note", "because", "it", "was", "close"];
      const N = tokens.length;

      // Realistic base raw match scores (Q · K)
      const rawScores = [
        [ 8,  4,  2,  3,  2,  1,  1,  1,  1], // The
        [ 3, 14,  9,  2,  6,  2,  3,  2,  3], // robot
        [ 2,  8, 16,  2, 11,  3,  2,  2,  4], // scored
        [ 3,  2,  2,  8,  4,  1,  1,  1,  1], // the
        [ 2,  5,  9,  4, 15,  2,  2,  2,  4], // Note
        [ 1,  2,  4,  1,  3, 10,  4,  3,  3], // because
        [ 2,  4,  5,  2, 16,  3,  8,  2,  4], // it -> strong link to Note (16)
        [ 1,  2,  3,  1,  2,  3,  5,  9,  4], // was
        [ 1,  3,  5,  1,  5,  3,  4,  4, 12]  // close
      ];

      let selectedQueryIndex = 6; // "it"

      function computeSoftmax(rowScores, scale) {
        const scaled = rowScores.map(s => s / scale);
        const maxS = Math.max(...scaled);
        const exp = scaled.map(s => Math.exp(s - maxS));
        const sumExp = exp.reduce((a, b) => a + b, 0);
        return exp.map(e => e / sumExp);
      }

      function render() {
        const isDark = document.documentElement.getAttribute('data-theme') !== 'light';
        const textColor = isDark ? '#f1f5f9' : '#0f172a';
        const mutedColor = isDark ? '#64748b' : '#94a3b8';
        const panelBg = isDark ? '#141923' : '#f8fafc';

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const scale = parseFloat(document.getElementById('scaleSlider').value);
        document.getElementById('scaleDisplay').textContent = scale.toFixed(1);

        // Left section: Heatmap Matrix (N x N)
        const gridSize = 28;
        const startX = 140;
        const startY = 80;

        // Draw Column Headers (Keys)
        ctx.font = '11px sans-serif';
        tokens.forEach((tok, c) => {
          ctx.fillStyle = mutedColor;
          ctx.save();
          ctx.translate(startX + c * gridSize + 14, startY - 10);
          ctx.rotate(-Math.PI / 4);
          ctx.fillText(tok, 0, 0);
          ctx.restore();
        });

        // Compute weights for all rows
        const allWeights = rawScores.map(row => computeSoftmax(row, scale));

        // Draw Matrix Cells
        for (let r = 0; r < N; r++) {
          // Row Header (Query)
          const isRowSelected = (r === selectedQueryIndex);
          ctx.fillStyle = isRowSelected ? '#38bdf8' : (isDark ? '#e2e8f0' : '#334155');
          ctx.font = isRowSelected ? 'bold 12px sans-serif' : '11px sans-serif';
          ctx.textAlign = 'right';
          ctx.fillText(tokens[r], startX - 12, startY + r * gridSize + 18);

          for (let c = 0; c < N; c++) {
            const weight = allWeights[r][c];
            const cellX = startX + c * gridSize;
            const cellY = startY + r * gridSize;

            // Cell color proportional to weight
            if (isRowSelected) {
              ctx.fillStyle = `rgba(56, 189, 248, ${Math.max(0.08, weight * 0.95)})`;
            } else {
              ctx.fillStyle = `rgba(148, 163, 184, ${Math.max(0.04, weight * 0.5)})`;
            }
            ctx.fillRect(cellX, cellY, gridSize - 2, gridSize - 2);

            if (isRowSelected) {
              ctx.strokeStyle = '#38bdf8';
              ctx.lineWidth = 1;
              ctx.strokeRect(cellX, cellY, gridSize - 2, gridSize - 2);
            }
          }
        }

        // Right Section: Visual Token Attention Bipartite Connections
        const rightStartX = 480;
        const activeWeights = allWeights[selectedQueryIndex];

        ctx.textAlign = 'left';
        ctx.font = 'bold 13px sans-serif';
        ctx.fillStyle = '#38bdf8';
        ctx.fillText(`Attention Routing for Query: "${tokens[selectedQueryIndex]}"`, rightStartX, 50);

        const rowH = 34;
        const listStartY = 80;

        tokens.forEach((tok, i) => {
          const y = listStartY + i * rowH;
          const w = activeWeights[i];
          const barW = Math.max(2, w * 200);

          // Bar
          ctx.fillStyle = (i === selectedQueryIndex) ? '#fbbf24' : (w > 0.3 ? '#4ade80' : 'rgba(56, 189, 248, 0.4)');
          ctx.fillRect(rightStartX + 70, y - 12, barW, 16);

          // Token text
          ctx.fillStyle = textColor;
          ctx.font = (w > 0.3) ? 'bold 12px monospace' : '12px monospace';
          ctx.fillText(tok, rightStartX, y);

          // Percentage text
          ctx.fillStyle = mutedColor;
          ctx.font = '11px sans-serif';
          ctx.fillText(`${(w * 100).toFixed(1)}%`, rightStartX + 75 + barW, y);
        });

        // Telemetry
        const maxW = Math.max(...activeWeights);
        const topIdx = activeWeights.indexOf(maxW);
        document.getElementById('queryLabel').textContent = `"${tokens[selectedQueryIndex]}" (Index ${selectedQueryIndex})`;
        document.getElementById('topTokenText').textContent = `"${tokens[topIdx]}"`;
        document.getElementById('topWeightText').textContent = `${(maxW * 100).toFixed(1)}%`;

        const focusEl = document.getElementById('focusText');
        if (scale < 4.0) {
          focusEl.textContent = 'Ultra-Sharp (Winner Take All)';
          focusEl.style.color = '#38bdf8';
        } else if (scale > 14.0) {
          focusEl.textContent = 'Diffuse / Near-Uniform';
          focusEl.style.color = '#f43f5e';
        } else {
          focusEl.textContent = 'Balanced Focus';
          focusEl.style.color = '#4ade80';
        }
      }

      canvas.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        const my = e.clientY - rect.top;
        const mx = e.clientX - rect.left;

        const startY = 80;
        const gridSize = 28;

        if (mx >= 60 && mx <= 420) {
          const row = Math.floor((my - startY) / gridSize);
          if (row >= 0 && row < N) {
            selectedQueryIndex = row;
            render();
          }
        }
      });

      document.getElementById('scaleSlider').addEventListener('input', render);

      document.getElementById('selectItBtn').addEventListener('click', () => {
        selectedQueryIndex = 6;
        render();
      });

      document.getElementById('selectScoredBtn').addEventListener('click', () => {
        selectedQueryIndex = 2;
        render();
      });

      render();
    })();
  </script>
</body>
</html>
